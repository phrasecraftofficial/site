<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PhraseCraft App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@18.2.0"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-hover: #2c2c2c;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-color: #bb86fc;
            --success-color: #03dac6;
            --error-color: #cf6679;
            --border-color: #333;
            --header-height: 60px;
            --footer-height: 60px; /* Mobile footer */
            --sidebar-width: 240px; /* Desktop sidebar */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* App-like feel */
        }

        /* --- LAYOUT SHELL --- */
        
        /* HEADER */
        .app-header {
            height: var(--header-height);
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            cursor: pointer; /* A mãozinha indica que é clicável */
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* Efeito visual ao passar o mouse */
        .header-title:hover {
            opacity: 0.8;
        }

        /* CONTAINER PRINCIPAL */
        .app-body {
            display: flex;
            flex: 1;
            margin-top: var(--header-height);
            height: calc(100vh - var(--header-height));
            overflow: hidden;
        }

        /* SIDEBAR (Desktop) */
        .app-sidebar {
            width: var(--sidebar-width);
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: none; /* Mobile first: hidden */
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sidebar-item:hover, .sidebar-item.active { background-color: var(--surface-hover); }
        .sidebar-item i { margin-right: 20px; width: 20px; text-align: center; font-size: 1.1rem; }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden; /* Evita scroll horizontal */
            padding: 20px;
            padding-bottom: 80px; /* Space for mobile footer */
            height: 100%; /* Garante altura para o scroll funcionar */
        }

        /* MOBILE FOOTER */
        .app-footer {
            height: var(--footer-height);
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
        }

        .footer-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
        }
        .footer-item.active { color: var(--text-primary); }
        .footer-item i { font-size: 1.2rem; margin-bottom: 4px; }

        /* --- VIEWS --- */
        .view-section { display: none; width: 100%; max-width: 800px; margin: 0 auto; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* LISTA DE LIÇÕES (Home) */
        .lesson-card {
            display: flex;
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .lesson-card:hover { transform: translateY(-2px); background-color: var(--surface-hover); }
        
        /* Procure por .lesson-thumb e SUBSTITUA por isso: */
      	.lesson-thumb {
            width: 100px;       /* Largura fixa da caixa */
            height: 100px;      /* Altura fixa (Torna a caixa quadrada para acomodar ambos) */
            background-color: #333; /* Fundo preto para as faixas laterais do Short */
            object-fit: contain;    /* O TRUQUE: A imagem se ajusta dentro sem cortar */
            border-radius: 0;     /* Bordas levemente arredondadas */
            flex-shrink: 0;         /* Garante que não amasse no flexbox */
        } 
        .lesson-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lesson-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .lesson-subtitle { color: var(--text-secondary); font-size: 0.9rem; }

        /* PREVIEW DA LIÇÃO */
        .preview-header { margin-bottom: 20px; text-align: center; }
        .preview-list { list-style: none; background: var(--surface-color); border-radius: 8px; padding: 10px; margin-bottom: 80px; }
        .preview-item {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-style: italic;
        }
        .preview-item:last-child { border-bottom: none; }

        /* MODO PREVIEW (Novo): Esconde navegação para focar no conteúdo */
        body.preview-mode .app-footer { display: none; }
        body.preview-mode .app-sidebar { display: none; }

        /* Ajusta o conteúdo para ocupar toda a tela */
        body.preview-mode .main-content { 
            padding-bottom: 20px; /* Remove o espaço do footer */
            max-height: calc(100vh - var(--header-height)); /* Altura exata disponível */
        }
        
        /* Ajusta o grid no Desktop para ocupar largura total */
        body.preview-mode .app-body { display: block; }
        
        .train-btn-container {
            position: fixed;
            /* Mudei de 70px para 30px para aproveitar o espaço do footer oculto */
            bottom: 30px; 
            left: 0; 
            right: 0;
            display: flex; 
            justify-content: center;
            pointer-events: none; /* Permite clicar no fundo se não acertar o botão */
            gap: 20px;
            z-index: 1000; /* Garante que fique acima de tudo */
        }
        .btn-train {
            pointer-events: auto;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            /* Diminuí o padding e a fonte */
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.4);
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        /* --- PAGINAÇÃO DE FASES (PREVIEW) --- */
        .phase-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .phase-btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 4px; /* Retangular com cantos suaves */
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            min-width: 40px;
        }
        
        .phase-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }
        
        .phase-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        /* --- MEDIA QUERIES (DESKTOP) --- */
        @media (min-width: 768px) {
            /* Mostra a sidebar e define o estilo "Mini" (YouTube style) */
            .app-sidebar { 
                display: flex; 
                width: 72px; /* Largura reduzida para estilo ícone */
                align-items: center; /* Centraliza tudo */
                padding-top: 10px;
            } 
        
            /* Transforma o item de lado-a-lado para empilhado */
            .sidebar-item {
                flex-direction: column; /* Ícone em cima, texto em baixo */
                justify-content: center;
                text-align: center;
                padding: 16px 0; /* Espaçamento vertical */
                width: 100%; /* Ocupa a largura da barra */
                gap: 6px; /* Espaço entre ícone e texto */
                font-size: 0.65rem; /* Texto pequeno como na imagem */
            }
        
            /* Ajuste do ícone para ficar centralizado e maior */
            .sidebar-item i { 
                margin-right: 0; /* Remove margem lateral antiga */
                font-size: 1.4rem; 
                margin-bottom: 2px;
            }
        
            /* Esconde o texto de versão que não cabe mais */
            .app-sidebar div:last-child {
                display: none;
            }
        
            /* Esconde footer mobile e ajusta container principal */
            .app-footer { display: none; } 
            .main-content { padding-bottom: 20px; } 
            .train-btn-container { position: static; margin-top: 30px; display: block; text-align: center; }
            .btn-train { display: inline-flex; width: auto; }
        }

        /* --- ESTILOS DO JOGO (QUIZ) --- */
        /* Mantendo os estilos internos do jogo que você aprovou */
        .quiz-container { text-align: center; padding: 10px; }
        .stats {
            display: flex;               /* Para alinhar lado a lado */
            justify-content: space-between; /* Um na esquerda, outro na direita */
            width: 100%;                 /* Garante que ocupe toda a largura */
            font-size: 0.9em;            /* Fonte menor original */
            color: #888;                 /* Cinza discreto original */
            margin-bottom: 20px;         /* Espaço original antes da barra */
        }
        /* --- NAVEGAÇÃO ENTRE TAREFAS --- */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .nav-btn {
            background: transparent;
            border: 0px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%; /* Botão Redondo */
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .nav-btn:hover:not(:disabled) {
            background-color: var(--surface-hover);
            border-color: var(--accent-color);
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
            color: var(--text-secondary);
        }
        .progress-bar { width: 100%; height: 6px; background-color: #333; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s ease; }
        .main-sentence { font-size: 1.3em; font-weight: bold; margin: 20px 0; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .prompt-text { color: var(--text-secondary); margin-bottom: 10px; }
        
        /* Match Styles */
        .match-container { display: flex; justify-content: space-between; gap: 10px; }
        .match-column { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .match-item { background: var(--surface-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9em; user-select: none; }
        .match-item.selected { background-color: #3700b3; border-color: var(--accent-color); color: white; }
        .match-item.matched {
            background-color: transparent;
            border-color: var(--success-color);
            color: var(--success-color);
            opacity: 0.5; /* Fica visível, mas "apagado" */
            cursor: default;
            pointer-events: none;
        }
        .match-item.error { background-color: var(--error-color); color: white; animation: shake 0.4s; }

        /* Multiple Choice */
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { background: var(--surface-color); color: var(--text-primary); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; cursor: pointer; text-align: left; }
        .option-btn:hover { border-color: var(--accent-color); }
        .option-btn.correct { background-color: var(--success-color); color: black; border-color: var(--success-color); }
        .option-btn.wrong { background-color: var(--error-color); border-color: var(--error-color); }

        /* Speech */
        .mic-btn { width: 70px; height: 70px; border-radius: 50%; background: var(--surface-color); border: 2px solid var(--accent-color); color: var(--accent-color); font-size: 1.8rem; margin: 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .mic-btn.listening { background: var(--error-color); border-color: var(--error-color); color: white; animation: pulse 1.5s infinite; }
        
        /* Jumble */
        .jumble-area { border: 1px dashed var(--border-color); min-height: 50px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; border-radius: 8px; margin-bottom: 15px; }
        .word-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px;}
        .word-tag { background: var(--surface-color); border: 1px solid var(--accent-color); padding: 6px 12px; border-radius: 15px; cursor: pointer; user-select: none; }

        /* Utilities */
        .hidden { display: none !important; }
        .check-btn { background: var(--accent-color); color: black; border: none; padding: 10px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(207, 102, 121, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }

        /* TRAINING MODE OVERRIDES */
        /* Esconde footer e sidebar quando estiver no modo treino */
        body.training-mode .app-footer { display: none; }
        body.training-mode .app-sidebar { display: none; }
        body.training-mode .app-body { grid-template-columns: 1fr; } /* Desktop full width */

      /* --- ESTADO DE ÁUDIO TOCANDO --- */
      body.audio-playing .btn-train,
      body.audio-playing .nav-btn,
      body.audio-playing .option-btn,
      body.audio-playing .word-tag,
      body.audio-playing .match-item,
      body.audio-playing .check-btn {
          opacity: 0.5;
          pointer-events: none; /* Bloqueia cliques */
          cursor: wait;
      }
      
      /* Indicador visual de áudio */
      #replay-audio-btn {
          margin-left: 10px;
          cursor: pointer;
          color: var(--accent-color);
          font-size: 1.1em;
          padding: 5px;
          transition: transform 0.2s;
      }
      #replay-audio-btn:hover {
          transform: scale(1.2);
          color: #fff;
      }
      body.audio-playing #replay-audio-btn {
          animation: pulseAudio 1s infinite;
          color: var(--success-color);
      }
      
      @keyframes pulseAudio {
          0% { opacity: 1; }
          50% { opacity: 0.5; }
          100% { opacity: 1; }
      }
      /* --- ESTADO DE VIDEO --- */
      .video-responsive-container {
          position: relative;
          padding-bottom: 56.25%; /* Proporção 16:9 */
          height: 0;
          background: #000;
      }
      .video-responsive-container iframe {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
      }
      /* Camada invisível que fica por cima do vídeo */
      .video-blocker {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 10; /* Fica acima do iframe do YouTube */
          background: transparent; /* Invisível */
          cursor: default; /* Remove o cursor de "mãozinha" */
      }
      .loop-active {
          background-color: var(--accent-color) !important;
          color: #000 !important;
      }
      .loop-inactive {
          background-color: #333 !important;
          color: #888 !important;
          border: 1px solid #555;
      }
      /* Animação de batida manual */
      @keyframes my-heartbeat {
          0% { transform: scale(1); }
          15% { transform: scale(1.25); } /* Cresce */
          30% { transform: scale(1); }    /* Volta */
          45% { transform: scale(1.15); } /* Cresce um pouco menos */
          60% { transform: scale(1); }    /* Volta */
          100% { transform: scale(1); }   /* Pausa */
      }
      
      .icon-pulsing {
          display: inline-block; /* Necessário para transformar */
          animation: my-heartbeat 1.5s infinite ease-in-out;
      }
      /* --- LOGIN STYLES --- */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh; /* Centraliza verticalmente */
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .login-input {
            width: 100%;
            padding: 12px 12px 12px 45px; /* Espaço para o ícone */
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-input:focus {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-title" onclick="navigateTo('home')">
            <i class="fa-solid fa-cube"></i> PhraseCraft v67
        </div>
        <div id="training-exit" class="hidden" style="margin-left: auto; cursor: pointer;" onclick="openPreview(currentLesson.id)">
            <i class="fa-solid fa-xmark" style="font-size: 1.5rem;"></i>
        </div>
    </header>

    <div class="app-body">
        
        <aside class="app-sidebar">
            <a class="sidebar-item active" onclick="navigateTo('home')">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a class="sidebar-item" onclick="navigateTo('you')">
                <i class="fa-regular fa-user"></i> You
            </a>
            <div style="margin-top: auto; padding: 20px; font-size: 0.8rem; color: #555;">
                PhraseCraft v1.0
            </div>
        </aside>

        <main class="main-content">
            
            <section id="view-home" class="view-section active">
                <h2 style="margin-bottom: 20px;">Sua Trilha</h2>
                <div id="lessons-list"></div>
            </section>

            <section id="view-preview" class="view-section">
                <div class="preview-header">
                    <img id="preview-thumb" src="" alt="Thumbnail" style="width: 100%; height: 250px; background-color: #000; object-fit: contain; border-radius: 12px; margin-bottom: 15px; display: block;">
                    <h2 id="preview-title" style="display: block; color: var(--accent-color); margin-bottom: 20px;"></h2>
                    <div id="phase-controls" class="phase-controls"></div>
                </div>

                <ul id="preview-sentences" class="preview-list">
                    </ul>

                <div class="train-btn-container">
    
                    <button class="btn-train" style="padding: 0 20px;" title="Vídeo Aula" onclick="startVideoPractice()">
                        <i class="fa-solid fa-video"></i>
                    </button>
                
                    <button class="btn-train" onclick="startTraining()" title="Exercícios Mentais">
                        <i class="fa-solid fa-graduation-cap icon-pulsing" style="font-size: 1.2rem;"></i> 
                    </button>
                
                    <button class="btn-train" style="padding: 0 20px;" title="Pronúncia" onclick="startSpeakingPractice()">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                
                </div>
            </section>

            <section id="view-you" class="view-section">
                <div style="background: var(--surface-color); padding: 30px 20px; text-align: center; border-bottom: 1px solid var(--border-color);">
                    <div id="profile-avatar" style="width: 80px; height: 80px; background: var(--accent-color); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 15px auto; border: 3px solid #fff;">
                        ??
                    </div>
                    
                    <h2 id="profile-name" style="margin-bottom: 5px;">Carregando...</h2>
                    <p id="profile-email" style="color: var(--text-secondary); font-size: 0.9rem;">...</p>
                </div>

                <div style="display: flex; justify-content: space-around; padding: 20px; border-bottom: 1px solid var(--border-color);">
                    <div style="text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: bold; color: var(--success-color);">0</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">Lições</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: bold; color: var(--accent-color);">0</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">XP Total</div>
                    </div>
                </div>

                <div style="padding: 20px;">
                    <button class="option-btn" style="width: 100%; text-align: center; margin-bottom: 10px; color: var(--error-color); border-color: var(--error-color);" onclick="handleLogout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
                    </button>
                </div>
            </section>
          
            <section id="view-login" class="view-section">
                <div class="login-container">
                    <i class="fa-solid fa-cube" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 20px;"></i>
                    <h2 style="margin-bottom: 10px;">Bem-vindo de volta</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 30px;">Faça login para salvar seu progresso.</p>

                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="Email" class="login-input" required>
                        </div>

                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" placeholder="Senha" class="login-input" required>
                        </div>

                        <button type="submit" class="btn-train" style="width: 100%; justify-content: center; margin-top: 10px;">
                            Entrar
                        </button>
                    </form>

                    <div style="margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary);">
                        Ainda não tem conta? <span style="color: var(--accent-color); cursor: pointer;">Cadastre-se</span>
                    </div>
                </div>
            </section>

            <section id="view-training" class="view-section">
                <div class="quiz-container">

    // Agora a função aceita uma lista como parâmetro
    // --- 3. ATUALIZAÇÃO DA RENDERIZAÇÃO (CORRIGIDA PARA LER DO SERVIDOR) ---
    function renderLessonList(lessonsToRender) {
        ui.listContainer.innerHTML = '';
        
        if (!lessonsToRender || lessonsToRender.length === 0) {
            ui.listContainer.innerHTML = '<p style="text-align:center; padding:20px; color:#888">Nenhuma lição disponível.</p>';
            return;
        }

        lessonsToRender.forEach(lesson => {
            const card = document.createElement('div');
            card.className = 'lesson-card';
            card.onclick = () => openPreview(lesson.id);

            // --- LÓGICA DE SUBTÍTULO OTIMIZADA ---
            let subtitleText = "";

            // 1. Prioridade: Dados diretos do Appwrite (na raiz do objeto)
            // Usamos != null para garantir que pegue mesmo se for 0, mas ignore undefined
            if (lesson.cards != null && lesson.phrases != null) {
                subtitleText = `${lesson.cards} cards | ${lesson.phrases} frases`;
            }
            // 2. Fallback: Dados manuais locais (objeto stats antigo)
            else if (lesson.stats) {
                subtitleText = `${lesson.stats.cards} cards | ${lesson.stats.phrases} frases`;
            } 
            // 3. Fallback: Cálculo se os dados brutos já estiverem carregados
            else if (Array.isArray(lesson.data)) {
                const totalPhrases = lesson.data.length;
                const totalCards = lesson.data.reduce((acc, item) => acc + (item.vocab ? item.vocab.length : 0), 0);
                subtitleText = `${totalCards} cards | ${totalPhrases} frases`;
            } 
            // 4. Último caso: Deixa vazio ou coloca um placeholder discreto
            else {
                subtitleText = "..."; 
            }

            // Renderiza o card
            card.innerHTML = `
                <img src="${lesson.thumb}" class="lesson-thumb" alt="${lesson.title}" loading="lazy" onerror="this.src='https://placehold.co/200x150?text=No+Image'">
                <div class="lesson-info">
                    <div class="lesson-title">${lesson.title}</div>
                    <div class="lesson-subtitle" style="font-size: 0.85em; color: var(--accent-color);">
                        <i class="fa-solid fa-layer-group"></i> ${subtitleText}
                    </div>
                </div>
            `;
            ui.listContainer.appendChild(card);
        });
    }

    async function openPreview(lessonId, addToHistory = true) {
        
        // 1. LIMPEZA INICIAL
        stopVideoPlayback(); 
        document.body.classList.remove('training-mode'); 
        
        // 2. BUSCA A LIÇÃO PRIMEIRO
        // Se lessonId for undefined, isso retorna undefined e evita o erro

            console.error("Lição não encontrada para o ID:", lessonId);
            ui.previewTitle.innerText = "Lição não encontrada";
            // Não muda o histórico se falhar
            return;
        }

        document.body.classList.add('preview-mode');
        if (ui.trainingExit) ui.trainingExit.classList.add('hidden');
       
        // Histórico seguro: só roda se a lição existe

            history.pushState({ view: 'preview', lessonId: rawLesson.id }, '', `#lesson-${rawLesson.id}`);
        } 

        // 4. Feedback visual

    // --- Gerencia o download dos dados ---
    async function fetchLessonData(lesson) {
        // 1. Prepara as promessas de download
        let srtEnPromise = lesson['srt-en']; // Tenta pegar texto direto primeiro
        let srtPtPromise = lesson['srt-pt'];
        let vocabPromise = lesson['data'];
    
        // Se não tem texto direto, verifica se tem URL e baixa
        if (!srtEnPromise && lesson['srt-en-url']) {
            srtEnPromise = fetch(lesson['srt-en-url']).then(res => res.text());
        }
        
        if (!srtPtPromise && lesson['srt-pt-url']) {
            srtPtPromise = fetch(lesson['srt-pt-url']).then(res => res.text());
        }
    
        if (!vocabPromise && lesson['pairs-url']) {
            vocabPromise = fetch(lesson['pairs-url']).then(res => res.json());
        }
    
        // 2. Aguarda tudo baixar ao mesmo tempo (Paralelo)
        try {
            // Se já era texto/objeto, o Promise.resolve resolve na hora. 
            // Se era fetch, ele espera baixar.
            const [srtEn, srtPt, vocabData] = await Promise.all([
                Promise.resolve(srtEnPromise),
                Promise.resolve(srtPtPromise),
                Promise.resolve(vocabPromise)
            ]);
    
            return { srtEn, srtPt, vocabData };
    
        } catch (error) {
            console.error("Erro ao carregar lição:", error);
            alert("Erro ao carregar conteúdo da lição. Verifique sua conexão.");
            return null;
        }
    }

    // --- PARSER DE SRT ---
  
    // Converte "00:00:02,500" para segundos (float)
    function timeToSeconds(timeString) {
        const parts = timeString.split(':');
        const seconds = parts[2].replace(',', '.');
        return (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60) + parseFloat(seconds);
    }
    
    function parseSRT(srtContent) {
        if (!srtContent) return [];
        const normalizedContent = srtContent.replace(/\r\n/g, '\n');
        const blocks = normalizedContent.trim().split(/\n\s*\n/);
        
        return blocks.map(block => {
            const lines = block.split('\n');
            if (lines.length < 3) return null;
    
            // Linha 1: "00:00:00,000 --> 00:00:02,000"
            const times = lines[1].split(' --> ');
            const start = timeToSeconds(times[0]);
            const end = timeToSeconds(times[1]);
    
            // Linha 2+: Texto
            const text = lines.slice(2).join(' ').replace(/<[^>]*>/g, '').trim();
            
            return { text, start, end };
        }).filter(item => item !== null);
    }
    
    // Agora ela não lê "lesson['srt-en']" direto, ela recebe os textos como argumentos
    function compileLessonData(srtEnContent, srtPtContent, vocabList, videoUrl) {
        // Se o vocabList já vier formatado como array final (lição antiga compilada), retorna ele
        if (Array.isArray(vocabList) && vocabList.length > 0 && vocabList[0].en && vocabList[0].id) {
            return vocabList;
        }
    
        const enBlocks = parseSRT(srtEnContent);
        const ptBlocks = parseSRT(srtPtContent);
        const vocabData = vocabList || [];
    
        return enBlocks.map((block, index) => {
            const ptBlock = ptBlocks[index] || { text: "" };
            const vocabObj = vocabData.find(v => v.vocab === (index + 1));
    
            return {
                id: index + 1,
                en: block.text,      
                pt: ptBlock.text,    
                start: block.start,  
                end: block.end,      
                videoUrl: videoUrl, 
                vocab: vocabObj ? vocabObj.list : []
            };
        });
    }

        if (!currentLesson || currentLesson.data.length === 0) return;

    // --- HELPER DE ÁUDIO COM BLOQUEIO ---
    function speakText(text, lang = 'en-US', onComplete = null) {
        if (!text) {
            if (onComplete) onComplete();
            return;
        }
    
        // Cancela fila anterior
        window.speechSynthesis.cancel();
    
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9; // Velocidade didática
    
        // EVENTO: Começou a falar -> Bloqueia tela
        utterance.onstart = () => {
            document.body.classList.add('audio-playing');
        };
    
        // EVENTO: Terminou de falar -> Libera tela e chama callback
        utterance.onend = () => {
            document.body.classList.remove('audio-playing');
            if (onComplete) onComplete();
        };
    
        // EVENTO: Erro -> Libera tela para não travar o app
        utterance.onerror = () => {
            document.body.classList.remove('audio-playing');
            if (onComplete) onComplete();
        };
    
        window.speechSynthesis.speak(utterance);
    }
  
    // --- 3. LÓGICA DO JOGO (ATUALIZADA: LOOP POR FRASE) ---
    function initQuizLogic(data) {
        quizQueue = [];
        currentIndex = 0;
        maxIndexReached = 0;
        score = 0;
        ui.scoreDisplay.innerText = "0";
    
        data.forEach(sentence => {
            // MODO VIDEO
            if (trainingMode === 'video') {
                quizQueue.push({ 
                    type: 'video_lesson', 
                    question: sentence.en, 
                    pt: sentence.pt,
                    start: sentence.start, // <--- IMPORTANTE
                    end: sentence.end,     // <--- IMPORTANTE
                    videoUrl: sentence.videoUrl // <--- IMPORTANTE
                });
                return; 
            }
            
            // MODO APENAS FALA
            if (trainingMode === 'speaking') {
                quizQueue.push({ 
                    type: 'speaking', 
                    question: sentence.en, 
                    correct: sentence.en 
                });
                return; // Pula o resto e vai para a próxima frase
            }
    
            // MODO COMPLETO (Seu código anterior do loop T1->T2->T3)
            if(sentence.vocab && sentence.vocab.length > 0) {
                quizQueue.push({ type: 'match', vocab: sentence.vocab });
            }
            
            quizQueue.push({ 
                type: 'jumble_en_to_pt', 
                display: sentence.en,     
                audioStart: sentence.en,  
                audioLang: 'en-US',
                correct: sentence.pt,     
                finalAudio: sentence.en   
            });
    
            quizQueue.push({ 
                type: 'jumble_pt_to_en', 
                display: sentence.pt,     
                audioStart: sentence.en,
                audioLang: 'en-US',
                correct: sentence.en,     
                wordAudio: true,
                finalAudio: sentence.en
            });
        });
    
        loadTask();
    }

    function getRandomDistractor(dataset, currentId, lang) {
        const others = dataset.filter(s => s.id !== currentId);
        if(others.length === 0) return "Alternative text placeholder";
        return others[Math.floor(Math.random() * others.length)][lang];
    }

    // 1. Match
    function setupMatch() {
        ui.matchWrapper.classList.remove('hidden');
        ui.display.innerText = "Conecte os pares";
        ui.prompt.innerText = "Vocabulário";
        
        ui.colLeft.innerHTML = '';
        ui.colRight.innerHTML = '';
        matchState = { selectedId: null, selectedSide: null, selectedElement: null, matchesFound: 0 };

        let pairs = currentTask.vocab; 
        let left = pairs.map((p, i) => ({ id: i, text: p.en, side: 'left' })).sort(() => Math.random() - 0.5);
        let right = pairs.map((p, i) => ({ id: i, text: p.pt, side: 'right' })).sort(() => Math.random() - 0.5);

        left.forEach(item => createMatchItem(item, ui.colLeft));
        right.forEach(item => createMatchItem(item, ui.colRight));
    }

    function createMatchItem(item, parent) {
        const div = document.createElement('div');
        div.className = 'match-item';
        div.innerText = item.text;
        
        div.onclick = () => {
            // NOVO: Se for lado esquerdo (Inglês), fala a palavra
            if (item.side === 'left') {
                speakText(item.text, 'en-US');
            }
            handleMatchClick(div, item.id, item.side);
        };
        
        parent.appendChild(div);
    }

    function handleMatchClick(el, id, side) {
        if (el.classList.contains('matched') || el.classList.contains('error')) return;
        
        if (matchState.selectedElement === el) {
            el.classList.remove('selected');
            matchState = { selectedId: null, selectedSide: null, selectedElement: null, matchesFound: matchState.matchesFound };
            return;
        }

        if (!matchState.selectedElement) {
            matchState.selectedElement = el;
            matchState.selectedId = id;
            matchState.selectedSide = side;
            el.classList.add('selected');
            return;
        }

        if (matchState.selectedSide === side) { // Troca selecao
            matchState.selectedElement.classList.remove('selected');
            matchState.selectedElement = el;
            matchState.selectedId = id;
            el.classList.add('selected');
            return;
        }

        if (matchState.selectedId === id) { // Acerto
            el.classList.add('matched');
            matchState.selectedElement.classList.remove('selected');
            matchState.selectedElement.classList.add('matched');
            matchState.matchesFound++;
            matchState.selectedElement = null;
            
            if (matchState.matchesFound === currentTask.vocab.length) {
                score++; ui.scoreDisplay.innerText = score;
                setTimeout(nextTask, 1000);
            }
        } else { // Erro
            el.classList.add('error');
            matchState.selectedElement.classList.add('error');
            let temp1 = el; let temp2 = matchState.selectedElement;
            setTimeout(() => {
                temp1.classList.remove('error', 'selected');
                temp2.classList.remove('error', 'selected');
            }, 500);
            matchState.selectedElement = null;
        }
    }

    // --- CONTROLE DE GRAVAÇÃO (MIC) ---
    async function toggleSpeech() {
        // Se já estiver ouvindo, para tudo
        if (isListening) { 
            stopRecording();
            return; 
        }
    
        // Inicia Reconhecimento de Texto (Score)
        if (recognition) {
            try { recognition.start(); } catch(e) {}
        }
    
        // Inicia Gravação de Áudio (Playback)
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
    
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };
    
            mediaRecorder.onstop = () => {
                console.log('🔴 MediaRecorder parou! Criando player...');
                console.log('AudioChunks coletados:', audioChunks.length);
                // Cria o Player de Áudio
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                console.log('🎵 URL do áudio criada:', audioUrl);
                createAudioPlayer(audioUrl);
                
                // Para as tracks do microfone para liberar o ícone de uso no navegador
                stream.getTracks().forEach(track => track.stop());
            };
    
            mediaRecorder.start();
            isListening = true; 
            ui.micBtn.classList.add('listening'); 
            ui.speechResult.innerText = "Gravando...";
            ui.speechResult.style.color = "var(--accent-color)";
    
        } catch (err) {
            console.error("Erro ao acessar microfone:", err);
            ui.speechResult.innerText = "Erro: Microfone não permitido.";
        }
    }
    
    function stopRecording() {
        isListening = false;
        ui.micBtn.classList.remove('listening');
        if(recognition) recognition.stop();
        if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    // Config Speech API

        recognition.onstart = () => { isListening = true; ui.micBtn.classList.add('listening'); ui.speechResult.innerText = "Ouvindo..."; };
        recognition.onend = () => { isListening = false; ui.micBtn.classList.remove('listening'); };

    function processSpeechResult(text) {

                <div style="font-size: 2.5rem; font-weight: bold; color: ${color}; margin: 10px 0;">
                    ${similarity.toFixed(0)}%
                </div>
                <div style="color: ${color}; font-size: 1.1rem; margin-bottom: 10px;">

        // Salva resultado para relatório
        if (trainingMode === 'speaking') {

                phrase: currentTask.question,

            });
            
            // FORÇA parada do MediaRecorder se ainda estiver gravando

            // Cria botão após pequeno delay
            setTimeout(() => {

                if (!existingBtn) {
                    console.log('✅ Criando botão Continuar (fallback)');
                    
                    const btnContinue = document.createElement('button');
                    btnContinue.id = 'btn-continue-speaking';
                    btnContinue.className = 'check-btn'; 
                    btnContinue.style.marginTop = '15px';
                    btnContinue.style.animation = 'fadeIn 0.5s'; 
                    btnContinue.innerText = "Continuar ❯";
                    btnContinue.onclick = () => {
                        console.log('▶️ Botão Continuar clicado');
                        nextTask();
                    };
                    ui.speechWrapper.appendChild(btnContinue);
                } else {
                    console.log('ℹ️ Botão já existe (criado pelo player)');
                }
            }, 800);
            
        } else {
            // Modo FULL: comportamento original
            if (similarity >= 70) {
                ui.micBtn.disabled = true;
                setTimeout(() => { ui.micBtn.disabled = false; nextTask(); }, 2000);
            }
        }
    }

    // --- 4. Jumble (ORGANIZAR FRASE) ---
    function setupJumble() {
        ui.jumbleWrapper.classList.remove('hidden');
        
        // Configura o Display com Ícone de Áudio
        // Usamos innerHTML para incluir o ícone FontAwesome
        ui.display.innerHTML = `
            ${currentTask.display} 
            <i class="fa-solid fa-volume-high" id="replay-audio-btn" title="Ouvir novamente"></i>
        `;
        
        ui.prompt.innerText = currentTask.type === 'jumble_en_to_pt' 
            ? "Traduza para Português:" 
            : "Ouça e monte em Inglês:";
        
        // Configura o clique no ícone para repetir o áudio
        const replayBtn = document.getElementById('replay-audio-btn');
        replayBtn.onclick = (e) => {
            e.stopPropagation(); // Evita bolha de evento
            speakText(currentTask.audioStart, currentTask.audioLang);
        };
    
        // Toca áudio inicial automaticamente
        if (currentTask.audioStart) {
            // Pequeno delay para a UI renderizar antes de bloquear
            setTimeout(() => {
                speakText(currentTask.audioStart, currentTask.audioLang);
            }, 300);
        }
    
        // Prepara palavras (limpa pontuação)
        let cleanCorrect = currentTask.correct.replace(/[.?!]/g, ''); 
        let words = cleanCorrect.split(' ').sort(() => Math.random() - 0.5);
    
        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word-tag'; 
            span.innerText = word;
            
            span.onclick = function() { 
                // Toca áudio da palavra se habilitado (apenas EN)
                if (currentTask.wordAudio) {
                    speakText(word, 'en-US');
                }
                // Move palavra
                const target = this.parentElement === ui.wordBank ? ui.answerZone : ui.wordBank;
                target.appendChild(this); 
            };
            
            ui.wordBank.appendChild(span);
        });
    }
    
    function checkJumble() {
        const userWords = Array.from(ui.answerZone.children).map(t => t.innerText).join(' ');
        
        // Normalização básica
        const normalize = (str) => str.toLowerCase().replace(/[.?!,]/g, '').trim();
        
        if (normalize(userWords) === normalize(currentTask.correct)) {
            // ACERTOU
            ui.answerZone.style.borderColor = "var(--success-color)";
            score++; 
            ui.scoreDisplay.innerText = score;
    
            // Feedback visual imediato, depois áudio
            if (currentTask.finalAudio) {
                // speakText recebe 'nextTask' como callback (onComplete)
                // Isso garante que só avança quando o áudio terminar
                speakText(currentTask.finalAudio, 'en-US', () => {
                    setTimeout(nextTask, 500); // Pequeno respiro após o áudio
                });
            } else {
                setTimeout(nextTask, 1000);
            }
    
        } else {
            // ERROU
            ui.answerZone.style.borderColor = "var(--error-color)";
            ui.answerZone.animate([
                { transform: 'translateX(0)' }, 
                { transform: 'translateX(-5px)' }, 
                { transform: 'translateX(5px)' }, 
                { transform: 'translateX(0)' }
            ], { duration: 400 });
        }
    }
    
    function resetJumble() { Array.from(ui.answerZone.children).forEach(tag => ui.wordBank.appendChild(tag)); }

    // Helpers
    function finishQuiz() {
        ui.quizContainer.classList.add('hidden');
        ui.finalScreen.classList.remove('hidden');
        
        // --- RELATÓRIO DE SPEAKING ---
        if (trainingMode === 'speaking') {
            // Calcula Média
            const totalScore = speakingResults.reduce((acc, curr) => acc + curr.score, 0);
            const average = speakingResults.length > 0 ? (totalScore / speakingResults.length).toFixed(0) : 0;

            // Monta HTML da lista
            let reportHTML = `
                <h2 style="color:var(--accent-color); margin-bottom:10px;">Resultado da Pronúncia</h2>
                <div style="font-size: 3rem; font-weight:bold; color:${average >= 70 ? 'var(--success-color)' : 'var(--error-color)'}; margin-bottom: 20px;">
                    ${average}%
                </div>
                <div style="text-align:left; max-height: 300px; overflow-y:auto; background:var(--surface-color); padding:10px; border-radius:8px; margin-bottom:20px;">
            `;

            speakingResults.forEach((res, idx) => {
                const color = res.score >= 70 ? 'var(--success-color)' : 'var(--error-color)';
                reportHTML += `
                    <div style="border-bottom:1px solid #333; padding: 10px 0;">
                        <div style="font-size:0.9em; color:#888;">Frase ${idx + 1}</div>
                        <div style="color: white; margin-bottom:5px;">${res.phrase}</div>
                        <div style="display:flex; justify-content:space-between; font-size:0.9em;">
                            <span style="color:${color}; font-weight:bold;">Nota: ${res.score.toFixed(0)}%</span>
                            <span style="font-style:italic; color:#666;">"${res.userText}"</span>
                        </div>
                    </div>
                `;
            });

            reportHTML += `</div>`;
            
            // Injeta no final screen (substituindo o padrão de Acertos)
            // Mantemos o título "Lição Concluída" que já está no HTML estático, mudamos o miolo
            const scoreArea = document.getElementById('final-score').parentElement; // O <p>Acertos...</p>
            scoreArea.innerHTML = reportHTML;

        } else {
            // --- RELATÓRIO PADRÃO (TREINO COMPLETO, VÍDEO, ETC) ---
            
            // Pegamos o tamanho real da fila de tarefas atual
            const totalTasks = quizQueue.length;

            // Atualizamos o HTML usando essa variável dinâmica
            const scoreElement = document.getElementById('final-score');
            
            // Se o elemento existir, atualizamos o pai dele
            if (scoreElement) {
                scoreElement.parentElement.innerHTML = `Acertos: <span id="final-score">${score}</span>/${totalTasks}`;
            }
        }

        document.body.classList.remove('training-mode');
    }
    
    function nextTask() {
        // Se o usuário está completando a tarefa mais avançada atual, desbloqueia a próxima
        if (currentIndex === maxIndexReached) {
            maxIndexReached++;
        }
        
        currentIndex++;
        loadTask();
    }

    function avaliarPronuncia(esperado, capturado) {
        const cleanExp = esperado.toLowerCase().replace(/[.,!?;:]/g, "").split(" ");
        const cleanCap = capturado.toLowerCase().replace(/[.,!?;:]/g, "").split(" ");
        let total = 0;
        for(let i=0; i<cleanExp.length; i++) {
            if(cleanCap[i] && cleanExp[i] === cleanCap[i]) total += 100;
            else if (cleanCap[i]) total += 50; 
        }
        return total / cleanExp.length;
    }

    // --- FUNÇÃO DE INÍCIO DA PRÁTICA DE FALA ---
    function startSpeakingPractice() {
        console.log('🚀 startSpeakingPractice iniciado');
        console.log('Definindo trainingMode = "speaking"');
        if (!currentLesson || currentLesson.data.length === 0) return;
        
        speakingResults = []; // <--- LIMPA RESULTADOS ANTERIORES
        trainingMode = 'speaking';
        
        document.body.classList.add('training-mode'); 
        ui.trainingExit.classList.remove('hidden');
    
        ui.views.forEach(v => v.classList.remove('active'));
        document.getElementById('view-training').classList.add('active');
        ui.quizContainer.classList.remove('hidden');
        ui.finalScreen.classList.add('hidden');
    
        const start = currentPhase * itemsPerPhase;
        const end = start + itemsPerPhase;
        const phaseData = currentLesson.data.slice(start, end);
    
        initQuizLogic(phaseData); 
    }

    // --- INÍCIO DA PRÁTICA COM VIDEO ---
    function setupVideo() {
        ui.videoWrapper.classList.remove('hidden');
        isVideoTaskComplete = false;
        
        // UI Limpa
        document.getElementById('video-answer-zone').innerHTML = '';
        document.getElementById('video-word-bank').innerHTML = '';
        document.getElementById('video-answer-zone').style.borderColor = '#444';
        document.getElementById('video-feedback').innerText = '';
    
        // 1. Configura Player (Mantido igual)
        const videoId = getYoutubeId(currentTask.videoUrl);
        // nem o teclado funcione (ex: apertar espaço para pausar se o vídeo estiver focado), 
        // atualize os `playerVars` na função `setupVideo()` para ser o mais restritivo possível.
        if (!ytPlayer) {
            ytPlayer = new YT.Player('yt-player', {
                height: '100%', 
                width: '100%', 
                videoId: videoId,
                playerVars: { 
                    'playsinline': 1, 
                    'controls': 0,     // Esconde a barra
                    'disablekb': 1,    // Desativa teclado (espaço/setas)
                    'fs': 0,           // Desativa botão fullscreen
                    'rel': 0,          // Evita vídeos relacionados ao final
                    'iv_load_policy': 3, // Esconde anotações
                    'modestbranding': 1 // Remove logo grande do YT
                },
                events: {
                    'onReady': () => playSegment(currentTask.start, currentTask.end)
                }
            });
        } else {
            const currentSrc = ytPlayer.getVideoUrl();
            if (currentSrc && currentSrc.includes(videoId)) {
                playSegment(currentTask.start, currentTask.end);
            } else {
                ytPlayer.loadVideoById(videoId);
                setTimeout(() => playSegment(currentTask.start, currentTask.end), 500);
            }
        }
    
        // 2. Prepara Palavras (CORRIGIDO PARA MANTER PONTUAÇÃO)
        // Não removemos mais pontuações, apenas quebras de linha
        let words = currentTask.question
            .replace(/\r?\n|\r/g, ' ')  // 1. Troca Enter por espaço
            .trim()                     // 2. Limpa espaços nas pontas
            .split(/\s+/)               // 3. Divide por espaços
            .filter(w => w.length > 0)  // 4. Garante que não há vazios
            .sort(() => Math.random() - 0.5); // 5. Embaralha
    
        const bank = document.getElementById('video-word-bank');
        const zone = document.getElementById('video-answer-zone');
    
        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'word-tag'; 
            span.innerText = word; // Exibe "apart," ou "you." visualmente
            
            span.onclick = function() { 
                // A. PREVENÇÃO DE CLIQUE DUPLO
                if (document.body.classList.contains('audio-playing')) return;
    
                document.body.classList.add('audio-playing');
    
                // B. LIMPA A PALAVRA SÓ PARA A FALA
                // Remove pontuação para o áudio ficar limpo (ex: "apart" em vez de "apart vírgula")
                const cleanWordForAudio = word.replace(/[.,?!":;]/g, '');
    
                const utterance = new SpeechSynthesisUtterance(cleanWordForAudio);
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
                
                const unlock = () => document.body.classList.remove('audio-playing');
                utterance.onend = unlock;
                utterance.onerror = unlock;
                
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
    
                // C. LÓGICA DO JOGO (Move a palavra com pontuação e tudo)
                const target = this.parentElement === bank ? zone : bank;
                target.appendChild(this); 
                
                checkVideoAnswer();
            };
            
            bank.appendChild(span);
        });
    }
  
    // FUNÇÃO DE INÍCIO DA PRÁTICA COM VIDEO
    function startVideoPractice() {
        console.log('🎥 startVideoPractice iniciado');
        
        if (!currentLesson || currentLesson.data.length === 0) return;
        
        // Define o modo
        trainingMode = 'video';
        
        // Ajustes visuais (entra na tela de treino)
        document.body.classList.add('training-mode'); 
        ui.trainingExit.classList.remove('hidden');
    
        ui.views.forEach(v => v.classList.remove('active'));
        document.getElementById('view-training').classList.add('active');
        ui.quizContainer.classList.remove('hidden');
        ui.finalScreen.classList.add('hidden');
    
        // Pega as frases da fase atual (paginação)
        const start = currentPhase * itemsPerPhase;
        const end = start + itemsPerPhase;
        const phaseData = currentLesson.data.slice(start, end);
    
        // Inicia a lógica
        initQuizLogic(phaseData); 
    }
  
    // Função chamada automaticamente pela API quando pronta
    function onYouTubeIframeAPIReady() {
        console.log("YouTube API Ready");
        // O player será criado apenas quando entrarmos na lição
    }
    
    // Extrai ID do vídeo (ex: v=Ao4ApRzPA3c -> Ao4ApRzPA3c)
    // Extrai ID do vídeo (agora aceita Shorts!)
    function getYoutubeId(url) {
        // Adicionei "|shorts\/" dentro do grupo de captura
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
    // Controla o segmento
    function playSegment(start, end) {
        if (!ytPlayer || !ytPlayer.seekTo) return;
    
        // Pula para o início da frase
        ytPlayer.seekTo(start);
        ytPlayer.playVideo();
    
        // Limpa timer anterior
        if (videoTimer) clearInterval(videoTimer);
    
        // Cria verificação para pausar no final da frase
        videoTimer = setInterval(() => {
            if (!ytPlayer.getCurrentTime) return;
            
            const current = ytPlayer.getCurrentTime();
            // Se passou do tempo final (com margem de 0.5s para não cortar abruptamente)
            if (current >= end) {
                ytPlayer.pauseVideo();
                clearInterval(videoTimer);
            }
        }, 100); // Checa a cada 100ms
    }
    
    function replayVideoSegment() {
        if (currentTask && currentTask.start !== undefined) {
            playSegment(currentTask.start, currentTask.end);
        }
    }

    function stopVideoPlayback() {
        // 1. Pausa o YouTube
        if (ytPlayer && ytPlayer.pauseVideo && typeof ytPlayer.pauseVideo === 'function') {
            try {
                ytPlayer.pauseVideo();
            } catch (e) {
                console.warn("Player ainda não estava pronto para pausar");
            }
        }
    
        // 2. Limpa o intervalo de verificação de tempo (loop)
        if (videoTimer) {
            clearInterval(videoTimer);
            videoTimer = null;
        }
    }
    
    function toggleVideoLoop() {
        videoLoopEnabled = !videoLoopEnabled;
        const btn = document.getElementById('btn-video-loop');
        
        if (videoLoopEnabled) {
            btn.className = 'check-btn loop-active';
            btn.innerHTML = '<i class="fa-solid fa-rotate"></i> <span>Loop: ON</span>';
            // Se ativou e o vídeo estava parado (mas a tarefa não acabou), toca
            if (!isVideoTaskComplete) replayVideoSegment();
        } else {
            btn.className = 'check-btn loop-inactive';
            btn.innerHTML = '<i class="fa-solid fa-rotate"></i> <span>Loop: OFF</span>';
        }
    }

    function playSegment(start, end) {
        if (!ytPlayer || !ytPlayer.seekTo) return;
  
        // Se a tarefa já foi concluída, não faz loop, toca só uma vez
        if (isVideoTaskComplete) {
            ytPlayer.seekTo(start);
            ytPlayer.playVideo();
            return; 
        }
    
        ytPlayer.seekTo(start);
        ytPlayer.playVideo();
    
        if (videoTimer) clearInterval(videoTimer);
    
        videoTimer = setInterval(() => {
            if (!ytPlayer.getCurrentTime) return;
            
            const current = ytPlayer.getCurrentTime();
            
            // Chegou ao fim do trecho?
            if (current >= end) {
                if (videoLoopEnabled && !isVideoTaskComplete) {
                    // Se Loop ON e não acabou: Volta pro início
                    ytPlayer.seekTo(start);
                } else {
                    // Se Loop OFF ou acabou: Pausa
                    ytPlayer.pauseVideo();
                    clearInterval(videoTimer);
                }
            }
        }, 100);
    }
  
    function checkVideoAnswer() {
        const bank = document.getElementById('video-word-bank');
        const zone = document.getElementById('video-answer-zone');
    
        // 1. Só valida se o banco estiver vazio
        if (bank.children.length > 0) {
            zone.style.borderColor = '#444'; 
            return; 
        }
    
        // 2. Monta a frase do usuário (baseada no texto dos botões)
        const userWords = Array.from(zone.children).map(t => t.innerText).join(' ');
        
        // --- CORREÇÃO CRÍTICA AQUI ---
        // Função de normalização robusta:
        // 1. Lowercase (para ignorar maiúsculas/minúsculas)
        // 2. Troca QUEBRAS DE LINHA (\n) por ESPAÇO
        // 3. Remove pontuações
        // 4. Remove espaços duplicados gerados pela troca de \n
        const normalize = (str) => str
            .toLowerCase()
            .replace(/\r?\n|\r/g, ' ')   // <--- O segredo: enter vira espaço
            .replace(/[.,?!":;]/g, '')   // Remove pontuação
            .replace(/\s+/g, ' ')        // Remove espaços duplos
            .trim();
    
        const correct = normalize(currentTask.question); // Texto original limpo
        const attempt = normalize(userWords);            // Texto do usuário limpo
    
        // 3. Comparação
        if (attempt === correct) {
            // --- ACERTOU ---
            zone.style.borderColor = "var(--success-color)";
            document.getElementById('video-feedback').innerHTML = `
                <p>Muito Bom!</p>
                <p>Ouça só mais uma vez!</p>
            `;
            score++;
            ui.scoreDisplay.innerText = score;
    
            isVideoTaskComplete = true; 
    
            // Toca o final e avança
            setTimeout(() => {
                if(ytPlayer && ytPlayer.seekTo) {
                    ytPlayer.seekTo(currentTask.start);
                    ytPlayer.playVideo();
                    
                    let finalCheck = setInterval(() => {
                        if(ytPlayer.getCurrentTime() >= currentTask.end) {
                            ytPlayer.pauseVideo();
                            clearInterval(finalCheck);
                            setTimeout(nextTask, 1000); 
                        }
                    }, 100);
                } else {
                    setTimeout(nextTask, 1500);
                }
            }, 500);
    
        } else {
            // --- ERROU ---
            zone.style.borderColor = "var(--error-color)";
            zone.animate([
                { transform: 'translateX(0)' }, 
                { transform: 'translateX(-5px)' }, 
                { transform: 'translateX(5px)' }, 
                { transform: 'translateX(0)' }
            ], { duration: 400 });
            
            // Opcional: Log para ajudar a debugar se ainda der erro
            console.log("Esperado:", correct);
            console.log("Recebido:", attempt);
        }
    }

    // --- NAVEGAÇÃO MOBILE (HISTORY API) ---
    
    function initMobileNavigation() {
        // 1. Define o estado inicial (Home) se não houver nenhum
        if (!history.state) {
            history.replaceState({ view: 'home' }, '', '#home');
        }

        // 2. Escuta o evento de "Voltar" do navegador/celular
        window.addEventListener('popstate', (event) => {
            const state = event.state;
            
            if (state) {
                // Se o estado tiver um ID de lição (estamos voltando para um Preview)
                if (state.view === 'preview' && state.lessonId) {
                    openPreview(state.lessonId, false); // false = não cria novo histórico
                } 
                // Se for modo treino
                else if (state.view === 'training') {
                     // Se o usuário voltou PARA o treino (raro, mas possível), reabre
                     // Mas geralmente queremos sair dele. 
                     // Simplificação: Se voltar para 'training', recarrega a view de treino
                     // Se voltar DE 'training', o state será 'preview' ou 'home'
                     
                     // A lógica aqui é invertida: o evento dispara PARA ONDE ESTAMOS INDO.
                     // Então, se o state for 'home', nós executamos navigateTo('home')
                     navigateTo(state.view, false);
                }
                // Navegação padrão (Home, You, Login)
                else {
                    navigateTo(state.view, false); // false = não cria novo histórico
                }
            } else {
                // Fallback: se não tiver estado, vai para home
                navigateTo('home', false);
            }
        });
    }

    // --- DEEP LINKING (ABRIR LINK DIRETO) ---
    // --- DEEP LINKING (ABRIR LINK DIRETO) ---
    function checkDeepLink() {
        const hash = window.location.hash; // Pega o que está depois do # (ex: #lesson-2)
        
        // 1. Verifica se é um link de lição
        if (hash && hash.startsWith('#lesson-')) {
            // Extrai o ID. Ex: "#lesson-2" vira "2"
            const idString = hash.replace('#lesson-', '');
            
            // Converte para número (pois seus IDs são numéricos: 1, 2...)
            const id = parseInt(idString);
            
            if (!isNaN(id)) {
                console.log("🔗 Link direto detectado para lição ID:", id);
                // Abre o preview SEM adicionar ao histórico (pois já estamos na URL certa)
                openPreview(id, false); 
            }
        } 
        // 2. Verifica se é link de perfil
        else if (hash === '#you') {
            navigateTo('you', false);
        }
        // 3. Verifica se é login
        else if (hash === '#login') {
            navigateTo('login', false);
        }
    }
  
    // --- 5. INICIALIZA O APP ---
    // Chame isso no final do script em vez de chamar renderLessonList() direto
    document.addEventListener('DOMContentLoaded', () => {
        initMobileNavigation();
        initApp();
    });
