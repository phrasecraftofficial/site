<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Vocab Master - Advanced Quiz</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root { --pink: #ff8fb1; --dark-pink: #ff5f9e; --bg: #121212; --card: #1e1e1e; }
    body { background-color: var(--bg); color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .container { background-color: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 650px; border: 1px solid #2a2a2a; }
    h1 { text-align: center; color: var(--pink); font-weight: 300; }
    .inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input { padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: #2a2a2a; color: #fff; outline: none; }
    button.main-btn { padding: 14px; background-color: var(--dark-pink); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    .selection-container { margin-top: 20px; display: none; }
    .word-block { margin-bottom: 20px; border: 1px solid #333; padding: 15px; border-radius: 8px; }
    .word-title { color: var(--pink); font-size: 1.2rem; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #333; }
    .btn-select { background-color: #333; color: #ddd; border: 1px solid #444; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-select.active { border-color: var(--pink); background-color: #3d2a30; color: var(--pink); }
    .section-divider { margin: 30px 0 15px; color: var(--pink); font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; border-bottom: 1px solid var(--pink); }
    .question { background-color: #262626; padding: 16px; border-radius: 10px; margin-bottom: 16px; border-left: 4px solid var(--pink); position: relative; }
    .info-icon { position: absolute; top: 10px; right: 10px; cursor: pointer; color: var(--pink); display: none; }
    .grammar-tag { display: none; background: #444; padding: 6px; border-radius: 4px; font-size: 12px; margin-top: 10px; color: var(--pink); }
    .btn-quiz { background-color: #333; color: white; border: 1px solid #555; padding: 10px; flex: 1; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    .result { margin-top: 10px; font-weight: bold; text-align: center; font-size: 14px; }
    .true { color: #6cff9e; }
    .false { color: #ff6c6c; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>Vocab Master Builder</h1>
  
  <div class="inputs">
    <input id="word1" placeholder="Palavra 1 (ex: Smart)" />
    <input id="word2" placeholder="Palavra 2 (ex: Fast)" />
    <button class="main-btn" onclick="fetchBothWords()">Carregar Definições</button>
  </div>

  <div id="selectionArea" class="selection-container">
    <div id="block1" class="word-block"></div>
    <div id="block2" class="word-block"></div>
    <button class="main-btn" id="generateQuizBtn" onclick="generateQuiz()" style="display:none">Gerar Super Quiz</button>
  </div>

  <div id="quizArea" class="hidden">
    <div id="questionsContainer"></div>
  </div>
</div>

<script>
  let choices = { w1: null, w2: null };

  async function getDefinitions(word) {
    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
    if (!response.ok) throw new Error(`Palavra "${word}" não encontrada`);
    return await response.json();
  }

  async function fetchBothWords() {
    const w1 = document.getElementById("word1").value.trim();
    const w2 = document.getElementById("word2").value.trim();
    if (!w1 || !w2) return alert("Preencha as duas palavras");

    try {
      const data1 = await getDefinitions(w1);
      const data2 = await getDefinitions(w2);
      renderOptions('block1', data1, 'w1');
      renderOptions('block2', data2, 'w2');
      document.getElementById("selectionArea").style.display = "block";
      document.getElementById("quizArea").classList.add("hidden");
    } catch (err) { alert(err.message); }
  }

  function renderOptions(elementId, data, key) {
    const block = document.getElementById(elementId);
    const word = data[0].word;
    block.innerHTML = `<div class="word-title">${word}</div>`;
    
    data.forEach(entry => {
      entry.meanings.forEach(m => {
        m.definitions.forEach(d => {
          const btn = document.createElement("button");
          btn.className = "btn-select";
          const syns = m.synonyms.length > 0 ? m.synonyms : (d.synonyms || []);
          const example = d.example || "No example available";
          
          btn.innerHTML = `<strong>[${m.partOfSpeech}]</strong> ${d.definition}<br><small style="color:#888">Ex: ${example}</small>`;
          btn.onclick = () => {
            block.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            choices[key] = { 
              word, 
              def: d.definition, 
              grammar: m.partOfSpeech, 
              synonym: syns[0] || "N/A",
              example: d.example || null
            };
            checkReady();
          };
          block.appendChild(btn);
        });
      });
    });
  }

  function checkReady() {
    if (choices.w1 && choices.w2) document.getElementById("generateQuizBtn").style.display = "block";
  }

  function generateQuiz() {
    const container = document.getElementById("questionsContainer");
    container.innerHTML = "";
    
    const quizData = [];
    
    // 1. QUESTÕES DE DEFINIÇÃO (4)
    quizData.push({ type: 'Definição', q: choices.w1.word, ans: choices.w1.def, correct: true, grammar: choices.w1.grammar });
    quizData.push({ type: 'Definição', q: choices.w1.word, ans: choices.w2.def, correct: false, grammar: choices.w2.grammar });
    quizData.push({ type: 'Definição', q: choices.w2.word, ans: choices.w2.def, correct: true, grammar: choices.w2.grammar });
    quizData.push({ type: 'Definição', q: choices.w2.word, ans: choices.w1.def, correct: false, grammar: choices.w1.grammar });

    // 2. QUESTÕES DE SINÔNIMOS (4)
    if (choices.w1.synonym !== "N/A" && choices.w2.synonym !== "N/A") {
      quizData.push({ type: 'Sinônimo', q: choices.w1.word, ans: `Sinônimo: ${choices.w1.synonym}`, correct: true, grammar: choices.w1.grammar });
      quizData.push({ type: 'Sinônimo', q: choices.w1.word, ans: `Sinônimo: ${choices.w2.synonym}`, correct: false, grammar: choices.w2.grammar });
      quizData.push({ type: 'Sinônimo', q: choices.w2.word, ans: `Sinônimo: ${choices.w2.synonym}`, correct: true, grammar: choices.w2.grammar });
      quizData.push({ type: 'Sinônimo', q: choices.w2.word, ans: `Sinônimo: ${choices.w1.synonym}`, correct: false, grammar: choices.w1.grammar });
    }

    // 3. QUESTÕES DE EXEMPLO (4)
    if (choices.w1.example && choices.w2.example) {
      const ex1 = choices.w1.example.replace(new RegExp(choices.w1.word, 'gi'), '_____');
      const ex2 = choices.w2.example.replace(new RegExp(choices.w2.word, 'gi'), '_____');
      quizData.push({ type: 'Exemplo', q: choices.w1.word, ans: `Frase: "${ex1}"`, correct: true, grammar: choices.w1.grammar });
      quizData.push({ type: 'Exemplo', q: choices.w1.word, ans: `Frase: "${ex2}"`, correct: false, grammar: choices.w2.grammar });
      quizData.push({ type: 'Exemplo', q: choices.w2.word, ans: `Frase: "${ex2}"`, correct: true, grammar: choices.w2.grammar });
      quizData.push({ type: 'Exemplo', q: choices.w2.word, ans: `Frase: "${ex1}"`, correct: false, grammar: choices.w1.grammar });
    }

    let lastType = "";
    quizData.forEach((q, i) => {
      if(q.type !== lastType) {
        container.innerHTML += `<div class="section-divider">${q.type}s</div>`;
        lastType = q.type;
      }
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `
        <span class="material-symbols-outlined info-icon" id="icon-${i}" onclick="toggleGrammar(${i})">info</span>
        <p><strong>${q.q.toUpperCase()}</strong> combina com:<br><small>${q.ans}</small>?</p>
        <div style="display:flex; gap:10px">
          <button class="btn-quiz" onclick="check(${i}, true, ${q.correct})">Verdadeiro</button>
          <button class="btn-quiz" onclick="check(${i}, false, ${q.correct})">Falso</button>
        </div>
        <div id="grammar-${i}" class="grammar-tag">Info: ${q.grammar}</div>
        <div id="res-${i}" class="result"></div>
      `;
      container.appendChild(div);
    });

    document.getElementById("quizArea").classList.remove("hidden");
    window.scrollTo({ top: document.getElementById("quizArea").offsetTop, behavior: 'smooth' });
  }

  function check(i, user, correct) {
    const res = document.getElementById(`res-${i}`);
    document.getElementById(`icon-${i}`).style.display = "block";
    if (user === correct) { res.innerHTML = "✔ ACERTOU"; res.className = "result true"; }
    else { res.innerHTML = "✘ ERROU"; res.className = "result false"; }
  }

  function toggleGrammar(i) {
    const g = document.getElementById(`grammar-${i}`);
    g.style.display = g.style.display === "block" ? "none" : "block";
  }
</script>

</body>
</html>
