<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Listening Pratice by Facebook Video</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(180deg, #121212 0%, #000000 100%);
    color: #ffffff;
    font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

h2 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    letter-spacing: -0.04em;
}

.status {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 8px;
    padding: 12px 20px;
    margin-bottom: 24px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: #b3b3b3;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.video-container {
    background: #181818;
    border-radius: 12px;
    padding: 24px;
    margin: 0 auto 32px;
    max-width: 600px;
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}
.timeline-container {
	flex-grow: 1; 
    margin: 0;
    width: 100%;
    height: 10px;
    background: #282828;
    border-radius: 10px;
    margin: 20px 0;
    position: relative;
    cursor: pointer;
    position: relative;
    user-select: none; /* Evita selecionar texto ao arrastar */
}

.timeline-segment {
    position: absolute;
    height: 100%;
    border-right: 1px solid #121212;
    background: #1db954;
    opacity: 0.3;
}

.timeline-handle {
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    pointer-events: none;
    transition: left 0.1s ease-out;
}
.controls {
    background: #181818;
    border-radius: 12px;
    padding: 24px;
    max-width: 600px;
    margin: 0 auto;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #ffffff;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

input, input[type="number"] {
    width: 100%;
    background: #000000;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 12px 16px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
    margin-bottom: 12px;
}

input[type="number"]:hover {
    border-color: #535353;
}

input[type="number"]:focus {
    outline: none;
    border-color: #1db954;
    box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.1);
}

button {
    background: #1db954;
    color: #ffffff;
    border: none;
    border-radius: 500px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    margin-top: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
    margin-bottom: 12px;
}

button:hover {
    background: #1ed760;
    transform: scale(1.04);
    box-shadow: 0 6px 16px rgba(29, 185, 84, 0.4);
}

button:active {
    transform: scale(0.98);
}

button.secondary {
    background: transparent;
    border: 2px solid #ffffff;
    color: #ffffff;
    box-shadow: none;
}

button.secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #1db954;
    color: #1db954;
    transform: scale(1.04);
}

button.danger {
    background: #87B800;
    box-shadow: 0 4px 12px rgba(226, 33, 52, 0.3);
}

button.danger:hover {
    background: #98CF02;
    box-shadow: 0 6px 16px rgba(226, 33, 52, 0.4);
}

.button-group {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.button-group button {
    margin-top: 0;
}

#status {
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Efeito de loading */
.loading::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
}

/* Scrollbar personalizada (estilo Spotify) */
::-webkit-scrollbar {
    width: 12px;
}

::-webkit-scrollbar-track {
    background: #000000;
}

::-webkit-scrollbar-thumb {
    background: #282828;
    border-radius: 6px;
}

::-webkit-scrollbar-thumb:hover {
    background: #3e3e3e;
}

/* Mobile Responsivo */
@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    h2 {
        font-size: 24px;
        margin-bottom: 16px;
    }

    .video-container {
        padding: 16px;
        min-height: 300px;
        margin-bottom: 20px;
        border-radius: 8px;
    }

    .controls {
    	width: 300px;
        padding: 16px;
        border-radius: 8px;
    }

    label {
        font-size: 12px;
        margin-bottom: 6px;
    }

    input[type="number"] {
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 6px;
        margin-bottom: 12px;
    }

    button {
        padding: 12px 24px;
        font-size: 14px;
        border-radius: 500px;
    }

    .button-group {
        flex-direction: column;
        gap: 8px;
    }

    .status {
        padding: 10px 16px;
        font-size: 12px;
        margin-bottom: 16px;
        border-radius: 6px;
    }
}

@media (max-width: 480px) {
    h2 {
        font-size: 20px;
    }

    .video-container {
        padding: 12px;
        min-height: 250px;
    }

    .controls {
        padding: 12px;
    }

    input[type="number"] {
        padding: 8px 12px;
        font-size: 14px;
    }

    button {
        padding: 10px 20px;
        font-size: 13px;
    }

    label {
        font-size: 11px;
    }
}

/* Modo landscape mobile */
@media (max-height: 500px) and (orientation: landscape) {
    body {
        padding: 8px;
    }

    .video-container {
        min-height: 200px;
        margin-bottom: 12px;
    }

    h2 {
        font-size: 18px;
        margin-bottom: 12px;
    }
}

/* Tablets */
@media (min-width: 769px) and (max-width: 1024px) {
    .container {
        max-width: 700px;
    }

    h2 {
        font-size: 28px;
    }

    .video-container,
    .controls {
        max-width: 100%;
    }
}

/* Animações suaves para inputs */
input[type="number"],
button {
    -webkit-tap-highlight-color: transparent;
}

/* Suporte para dark mode do sistema */
@media (prefers-color-scheme: dark) {
    body {
        background: linear-gradient(180deg, #121212 0%, #000000 100%);
    }
}

/* Acessibilidade - foco visível */
button:focus-visible,
input:focus-visible {
    outline: 2px solid #1db954;
    outline-offset: 2px;
}

/* Melhorias para touch devices */
@media (hover: none) and (pointer: coarse) {
    button {
        min-height: 44px;
    }

    input[type="number"] {
        min-height: 44px;
    }
}
    </style>
</head>
<body>

    <h2>Listening Pratice by Facebook Video</h2>
    
    <div class="controls">
        <label for="video-url-input">Video Url:</label>
        <input type="text" id="video-url-input" placeholder="Cole o link do vídeo do Facebook aqui..." 
               value="https://www.facebook.com/watch/?v=712864497879562">

        <button onclick="carregarNovoVideo()" class="secondary" style="margin-top: 10px;">Carregar Vídeo</button>
        
    	<div id="status" class="status">Carregando player...</div>
    </div>

    <div class="video-container" id="video-wrapper">
        <div 
            class="fb-video" 
            id="meu-player-fb"
            data-href="" 
            data-width="300" 
            data-allowfullscreen="true">
        </div>
    </div>
	
    <div class="controls">
        
    	<div style="display: flex; align-items: center; gap: 15px; margin: 20px 0;">

            <button id="btn-principal" onclick="dispararFluxo()" 
                    style="width: 5px; height: 5px; min-width: 5px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 6px 2.5px 0;">
                ▶︎
            </button>

            <div id="timeline" class="timeline-container" style="">
                <div class="timeline-handle" id="handle"></div>
            </div>
        </div>
        
        <label for="segundos-input">Segundos:</label>
        
        <input type="number" id="segundos-input" value="3" min="1" step="1">

        <label for="repeticoes-input">Repetições:</label>
        <input type="number" id="repeticoes-input" value="4" min="1" step="1">
        
        <p>.</p>
        
        <label for="velocidade-select">Velocidade:</label>
		<select id="velocidade-select" onchange="alterarVelocidade(this.value)" 
                style="width: 100%; background: #000; color: #fff; padding: 12px; border-radius: 8px; border: 1px solid #333; margin-bottom: 12px;">
            <option value="0.5">0.5x (Muito Lento)</option>
            <option value="0.75">0.75x (Lento)</option>
            <option value="1" selected>1.0x (Normal)</option>
            <option value="1.25">1.25x (Rápido)</option>
            <option value="1.5">1.5x (Muito Rápido)</option>
            <option value="2">2.0x (Flash)</option>
        </select>
		
    
        <button onclick="abrirModoFocado()" class="secondary">Abrir em Janela Separada</button>
    
    </div>
    

<div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

    <script>
    let player;
    let blocos = [];
    let blocoAtual = 0;
    let repeticoesRestantes = 0;
    let monitorIntervalo;
    let fluxoAtivo = false;

    // Configuração inicial da SDK
    window.fbAsyncInit = function() {
        FB.init({
            appId      : '', // Pode deixar vazio para uso básico
            xfbml      : true,
            version    : 'v18.0'
        });

        // Captura o evento de quando o player está pronto
        FB.Event.subscribe('xfbml.ready', function(msg) {
          if (msg.type === 'video' && msg.id === 'meu-player-fb') {
              player = msg.instance;
              document.getElementById('status').innerText = "Player pronto!";

              // Aguarda um segundo para o player obter os metadados (duração)
              setTimeout(() => {
                  const duracaoTotal = player.getDuration();
                  const segundos = parseInt(document.getElementById('segundos-input').value);

                  // Recalcula blocos e redesenha a timeline para o novo vídeo
                  blocos = dividirVideoEmBlocos(duracaoTotal, segundos);
                  if (typeof criarTimeline === "function") {
                      criarTimeline(duracaoTotal, segundos);
                  }
              }, 1000);
          }
      });
    };
    
function carregarNovoVideo() {
    const url = document.getElementById('video-url-input').value;
    
    // Tenta detectar se é um link de post e extrair apenas a ID numérica final
    if (url.includes("posts/")) {
        const partes = url.split('/');
        // Pega o último número da URL (removendo a barra final se existir)
        const videoId = partes.filter(p => p !== "").pop();
        if (!isNaN(videoId)) {
            url = `https://www.facebook.com/facebook/videos/${videoId}/`;
            console.log("URL convertida para formato compatível:", url);
        }
    }
    
    if (!url) {
        alert("Por favor, cole uma URL válida do Facebook.");
        return;
    }

    // 1. Para qualquer fluxo rodando
    pararFluxo();
    document.getElementById('status').innerText = "Carregando novo vídeo...";

    // 2. Limpa o container atual e insere o novo código XFBML
    const wrapper = document.getElementById('video-wrapper');
    wrapper.innerHTML = `
        <div class="fb-video" 
             id="meu-player-fb" 
             data-href="${url}" 
             data-width="300" 
             data-allowfullscreen="true">
        </div>
    `;

    // 3. Comando fundamental: Pede para a SDK do Facebook processar a nova div
    if (window.FB) {
        FB.XFBML.parse(wrapper, function() {
            console.log("Novo vídeo processado pela SDK.");
            // O evento 'xfbml.ready' será disparado automaticamente após isso
        });
    }
}

// Função que divide o vídeo em blocos
function dividirVideoEmBlocos(duracao, segundosPorBloco) {
    let blocosArray = [];
    let inicio = 0;
    
    while (inicio < duracao) {
        let fim = Math.min(inicio + segundosPorBloco, duracao);
        blocosArray.push({
            inicio: inicio,
            fim: fim,
            duracao: fim - inicio
        });
        inicio = fim;
    }
    
    return blocosArray;
}

// Função principal que inicia todo o fluxo
function dispararFluxo() {
    if (!player) {
        alert("Player não está pronto ainda.");
        return;
    }

    // Se já estiver ativo, o botão funciona como "Parar"
    if (fluxoAtivo) {
        pararFluxo();
        return;
    }
    
    const inputSegundos = document.getElementById('segundos-input');
    const inputRepeticoes = document.getElementById('repeticoes-input');
    
    const segundos = parseInt(inputSegundos.value);
    const totalRepeticoes = parseInt(inputRepeticoes.value);
    
    if (isNaN(segundos) || segundos <= 0 || isNaN(totalRepeticoes) || totalRepeticoes <= 0) {
        alert("Insira valores válidos.");
        return;
    }

    // Alterar visual do botão ao iniciar
    const btn = document.getElementById('btn-principal');
    btn.innerText = "❚❚";

    // Pega a duração total do vídeo
    const duracao = player.getDuration();
    
    // Divide o vídeo em blocos
    blocos = dividirVideoEmBlocos(duracao, segundos);
    
    console.log("Vídeo dividido em " + blocos.length + " blocos:", blocos);
    document.getElementById('status').innerText = 
        `Vídeo dividido em ${blocos.length} blocos de ${segundos}s`;
	
    // Reseta variáveis de controle
    blocoAtual = 0;
    repeticoesRestantes = totalRepeticoes;
    fluxoAtivo = true;
    
    // Pausa antes de começar
    player.pause();
    
    // Delay inicial antes de processar
    setTimeout(function() {
        processarBloco(totalRepeticoes);
    }, 500);
}

// Função que processa um bloco específico
function processarBloco(totalRepeticoes) {
    if (!fluxoAtivo || blocoAtual >= blocos.length) {
        document.getElementById('status').innerText = "Processamento concluído!";
        pararFluxo();
        return;
    }
    
    const bloco = blocos[blocoAtual];
    
    document.getElementById('status').innerText = 
        `Bloco ${blocoAtual + 1}/${blocos.length} - Repetição ${totalRepeticoes - repeticoesRestantes + 1}/${totalRepeticoes} (${bloco.inicio.toFixed(1)}s - ${bloco.fim.toFixed(1)}s)`;
    
    console.log(`Processando bloco ${blocoAtual + 1}: ${bloco.inicio.toFixed(1)}s a ${bloco.fim.toFixed(1)}s`);
    
    // GAMBIARRA 1: Pausa antes de fazer seek
    player.pause();
    
    // GAMBIARRA 2: Aguarda um pouco antes de fazer o seek
    setTimeout(function() {
        if (!fluxoAtivo) return;
        
        // Vai para o início do bloco
        player.seek(bloco.inicio);
        
        // GAMBIARRA 3: Aguarda o seek "pegar" antes de dar play
        setTimeout(function() {
            if (!fluxoAtivo) return;
            
            player.play();
            
            // GAMBIARRA 4: Aguarda começar a tocar antes de monitorar
            setTimeout(function() {
                if (!fluxoAtivo) return;
                monitorarBloco(bloco, totalRepeticoes);
            }, 200);
            
        }, 300);
        
    }, 200);
}

// Função que monitora a reprodução do bloco
function monitorarBloco(bloco, totalRepeticoes) {
    clearInterval(monitorIntervalo);
    
    let ultimaPosicao = -1;
    let contadorTravado = 0;
    
    monitorIntervalo = setInterval(function() {
        if (!player || !fluxoAtivo) {
            clearInterval(monitorIntervalo);
            return;
        }
        
        let tempoAgora = player.getCurrentPosition();

        // --- NOVO: Atualiza a posição da bolinha na Timeline ---
        const duracaoTotal = player.getDuration();
        if (duracaoTotal > 0) {
            const percentual = (tempoAgora / duracaoTotal) * 100;
            const handle = document.getElementById('handle');
            if (handle) {
                handle.style.left = Math.min(percentual, 100) + "%";
            }
        }
        
        // Verifica se o vídeo travou (não está avançando)
        if (Math.abs(tempoAgora - ultimaPosicao) < 0.01) {
            if (fluxoAtivo) {
                contadorTravado++;
            }
            
            // Se travar por mais de 2 segundos (20 * 100ms)
            if (contadorTravado > 20) { 
                console.warn("Vídeo travado ou buffer, forçando re-seek");
                clearInterval(monitorIntervalo);
                // Tenta resetar o bloco atual em vez de apenas avançar
                processarBloco(totalRepeticoes);
                return;
            }
        }
        else {
            contadorTravado = 0;
        }
        ultimaPosicao = tempoAgora;
        
        // --- Lógica de Repetição do Bloco ---
        // Verifica se chegou no fim planejado do bloco
        if (tempoAgora >= bloco.fim - 0.2) {
            clearInterval(monitorIntervalo);
            avancarParaProximoEstado(totalRepeticoes);
        }

        // Correção de segurança: se o vídeo "pular" para muito longe do bloco
        if (tempoAgora > bloco.fim + 1.5 || tempoAgora < bloco.inicio - 1.5) {
             console.warn("Desvio de rota detectado, reposicionando...");
             clearInterval(monitorIntervalo);
             processarBloco(totalRepeticoes);
        }

    }, 100); // Checa a cada 100ms para precisão de listening
}

// Função auxiliar para avançar o estado (repetir ou próximo bloco)
function avancarParaProximoEstado(totalRepeticoes) {
    if (repeticoesRestantes > 1) {
        // Ainda faltam repetições deste bloco
        repeticoesRestantes--;
        console.log(`Repetindo bloco ${blocoAtual + 1}. Restam ${repeticoesRestantes} repetições`);
        
        // GAMBIARRA 6: Delay antes de repetir
        setTimeout(function() {
            if (fluxoAtivo) {
                processarBloco(totalRepeticoes);
            }
        }, 400);
        
    } else {
        // Acabaram as repetições deste bloco, vai para o próximo
        console.log(`Bloco ${blocoAtual + 1} concluído. Avançando para bloco ${blocoAtual + 2}...`);
        
        blocoAtual++;
        repeticoesRestantes = totalRepeticoes;
        
        // GAMBIARRA 7: Delay maior antes de mudar de bloco
        setTimeout(function() {
            if (fluxoAtivo) {
                processarBloco(totalRepeticoes);
            }
        }, 500);
    }
}

// Função para parar o fluxo
function pararFluxo() {
    fluxoAtivo = false;
    clearInterval(monitorIntervalo);
    
    if (player) {
        player.pause();
    }

    // Resetar o botão para o estado inicial
    const btn = document.getElementById('btn-principal');
    btn.innerText = "▶︎";

    document.getElementById('status').innerText = "Fluxo interrompido.";
}

function pausarVideo() {
    pararFluxo();
}
function gerarTimelineVisual(blocos) {
    const container = document.getElementById('timeline-visual');
    container.innerHTML = ''; // Limpa anterior

    blocos.forEach((bloco, index) => {
        const div = document.createElement('div');
        div.className = 'timeline-block';
        div.innerText = index + 1;
        div.title = `${bloco.inicio.toFixed(1)}s - ${bloco.fim.toFixed(1)}s`;
        
        div.onclick = () => {
            // Remove ativo de todos e adiciona neste
            document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('active'));
            div.classList.add('active');
            
            // Pula o vídeo para o início do bloco
            player.seek(bloco.inicio);
            player.play();
        };
        
        container.appendChild(div);
    });
}
function criarTimeline(duracaoTotal, segundosPorBloco) {
    const container = document.getElementById('timeline');
    container.innerHTML = '<div class="timeline-handle" id="handle"></div>';
    
    const numBlocos = Math.ceil(duracaoTotal / segundosPorBloco);
    const larguraBloco = 100 / numBlocos;

    for (let i = 0; i < numBlocos; i++) {
        const segmento = document.createElement('div');
        segmento.className = 'timeline-segment';
        segmento.style.width = `${larguraBloco}%`;
        segmento.style.left = `${i * larguraBloco}%`;
        
        // Ao clicar no segmento, pula para o bloco
        segmento.onclick = () => pularParaBloco(i);
        container.appendChild(segmento);
    }
}

function pularParaBloco(index) {
    if (!player) return;

    blocoAtual = index;
    const bloco = blocos[blocoAtual];
    
    // Resetar repetições para o valor original do input
    const inputRepeticoes = document.getElementById('repeticoes-input');
    repeticoesRestantes = parseInt(inputRepeticoes.value) || 4;

    console.log(`Pulando para Bloco ${index + 1}: ${bloco.inicio}s`);
    
    // Força o player a ir para o início do bloco
    player.seek(bloco.inicio);
    
    // Se o fluxo não estiver ativo, inicia ele automaticamente ao clicar
    if (!fluxoAtivo) {
        fluxoAtivo = true;
        document.getElementById('btn-principal').innerText = "❚❚";
        document.getElementById('btn-principal').classList.add('danger');
    }

    // Reinicia o processamento a partir deste novo bloco
    setTimeout(() => {
        processarBloco(parseInt(inputRepeticoes.value));
    }, 300);
}

function atualizarPosicaoBolinha(tempoAtual) {
    const handle = document.getElementById('handle');
    const duracaoTotal = player.getDuration();
    const percentual = (tempoAtual / duracaoTotal) * 100;
    handle.style.left = percentual + "%";
}

// Detecta mudança no input de segundos para refazer a linha do tempo
document.getElementById('segundos-input').addEventListener('change', function() {
    if (player) {
        const duracaoTotal = player.getDuration();
        const novosSegundos = parseInt(this.value);
        
        blocos = dividirVideoEmBlocos(duracaoTotal, novosSegundos);
        criarTimeline(duracaoTotal, novosSegundos);
    }
});

// Adiciona os eventos de interação após o carregamento da página
document.addEventListener('DOMContentLoaded', function() {
    const timeline = document.getElementById('timeline');
    
    // Clique direto na barra
    timeline.addEventListener('mousedown', (e) => lidarCliqueBarra(e));
    
    // Suporte para Touch (Celular)
    timeline.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        lidarCliqueBarra(touch);
    });
});

function lidarCliqueBarra(e) {
    if (!player) return;

    const timeline = document.getElementById('timeline');
    const rect = timeline.getBoundingClientRect();
    const x = e.clientX - rect.left; // Posição X do clique dentro da barra
    const larguraTotal = rect.width;
    
    // Calcula a porcentagem clicada (0 a 1)
    const percentual = Math.max(0, Math.min(1, x / larguraTotal));
    const tempoDesejado = percentual * player.getDuration();

    // Encontra qual bloco corresponde a esse tempo
    const indexBloco = blocos.findIndex(b => tempoDesejado >= b.inicio && tempoDesejado <= b.fim);
    
    if (indexBloco !== -1) {
        pularParaBloco(indexBloco);
    }
}

function abrirModoFocado() {
    // Define o tamanho da janelinha
    const largura = 650;
    const altura = 850;
    
    // Calcula o centro da tela
    const esquerda = (window.screen.width / 2) - (largura / 2);
    const topo = (window.screen.height / 2) - (altura / 2);

    // Abre a URL atual em uma nova janela sem barras de ferramentas
    window.open(
        window.location.href, 
        'ListeningPractice', 
        `width=${largura},height=${altura},left=${esquerda},top=${topo},menubar=no,toolbar=no,location=no,status=no,resizable=yes`
    );
}
