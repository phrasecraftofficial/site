<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Vídeo Facebook</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; }
        .video-container { margin: 20px auto; max-width: 500px; min-height: 300px; }
        button { 
            background: #4267B2; color: white; border: none; 
            padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 4px;
        }
        button:hover { background: #365899; }
        .status { color: #aaa; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Controle de Vídeo via Facebook API</h2>
    <div id="status" class="status">Carregando player...</div>

    <div class="video-container">
        <div 
            class="fb-video" 
            id="meu-player-fb"
            data-href="https://www.facebook.com/watch/?v=712864497879562" 
            data-width="300" 
            data-allowfullscreen="true">
        </div>
    </div>

    <div class="controls">
        <label for="segundos-input">Segundos:</label>
        <input type="number" id="segundos-input" value="3" min="1" step="1">

        <label for="repeticoes-input">Repetições:</label>
        <input type="number" id="repeticoes-input" value="2" min="1" step="1">

        <button onclick="dispararFluxo()">Retroceder e Repetir</button>

        <div id="status">Aguardando...</div>
    </div>

    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/pt_BR/sdk.js"></script>

    <script>
    let player; // Variável global para armazenar a instância do vídeo
    
    let repeticoesRestantes =  document.getElementById('repeticoes-input');
    
    
	let monitorIntervalo; // Variável para controlar o loop de monitoramento
    

    window.fbAsyncInit = function() {
        FB.init({
            appId      : '', // Pode deixar vazio para testes locais
            xfbml      : true,
            version    : 'v18.0'
        });

        // Quando o player estiver pronto, capturamos a instância dele
        FB.Event.subscribe('xfbml.ready', function(msg) {
            if (msg.type === 'video' && msg.id === 'meu-player-fb') {
                player = msg.instance;
                document.getElementById('status').innerText = "Player pronto!";
                
                // Exemplo: Dar play automático (opcional, mas navegadores podem bloquear)
                // player.play(); 
            }
        });
    };

function dispararFluxo() {
    const input = document.getElementById('segundos-input');
    const segundos = parseInt(input.value);
    
    if (isNaN(segundos) || segundos <= 0) {
        alert("Insira um valor válido.");
        return;
    }

    repeticoesRestantes = 6;
    retroceder(segundos);
}

function retroceder(segundos) {
    if (!player) return;

    const tempoAtual = player.getCurrentPosition();
    let novoTempo = tempoAtual - segundos;
    if (novoTempo < 0) novoTempo = 0;

    // 1. Primeiro movemos o "cabeçote" do vídeo para o passado (ainda pausado)
    player.seek(novoTempo);
    player.play();  

    // 2. O delay de 1s agora acontece com o vídeo parado ou saltando
    setTimeout(function() {
        console.log("Iniciando reprodução do trecho em: " + novoTempo + "s");
        
        // 3. Só damos play DEPOIS que o tempo já foi ajustado
        player.play(); 
        
        monitorarEPausar(tempoAtual, segundos);
    }, 100); 
}

function monitorarEPausar(tempoAlvo, segundos) {
    clearInterval(monitorIntervalo);

    monitorIntervalo = setInterval(function() {
        if (!player) return;

        let tempoAgora = player.getCurrentPosition();

        if (tempoAgora >= tempoAlvo) {
            clearInterval(monitorIntervalo);
            pausarVideo(); // Pausa ao chegar no objetivo

            if (repeticoesRestantes > 1) {
                repeticoesRestantes--; 
                console.log("Preparando segunda repetição...");
                
                // Chama retroceder diretamente. 
                // A função retroceder agora cuida de posicionar e dar play.
                retroceder(segundos);
            } else {
                console.log("Fluxo finalizado.");
                repeticoesRestantes = 0;
            }
        }
    }, 500);
}

function pausarVideo() {
    if (player) player.pause();
}
    
</script>
</body>
</html>
