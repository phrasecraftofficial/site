<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage & Topics Viewer</title>
    <style>
    :root {
    --bg-dark: #121212;
    --text-light: #e0e0e0;
    --accent-color: #bb86fc; /* Cor de destaque para o tema dark */
    --card-bg: #1e1e1e;
    --card-hover: #2c2c2c;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-light);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    /* --- Títulos --- */
    .title-area {
        padding: 15px 0;
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
        max-width: 1000px;
    }

    #stage-title {
        font-size: 2.5em;
        color: var(--accent-color);
        margin: 0;
    }

    #topic-title {
        font-size: 1.8em;
        color: var(--text-light);
        margin: 0;
    }

    /* --- Separador --- */
    hr {
        border: none;
        height: 1px;
        background-color: var(--card-bg);
        width: 80%;
        max-width: 900px;
        margin: 10px 0 30px 0;
    }

    /* --- Área de Cards --- */
    .card-area {
        width: 100%;
        max-width: 1000px;
        margin-bottom: 30px;
    }

    .card-label {
        font-size: 0.75em;
        color: var(--accent-color);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 10px;
        text-align: left;
    }

    .mini-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px;
        background-color: var(--card-bg);
        border-radius: 8px;
        min-height: 50px; /* Para manter a área visível mesmo vazia */
        justify-content: flex-start; /* Alinha os cards à esquerda */
    }

    .mini-card {
        background-color: var(--bg-dark);
        color: var(--text-light);
        border: 1px solid var(--accent-color);
        border-radius: 4px;
        padding: 8px 15px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s, transform 0.1s;
        /* Estilo para ter apenas o número e ser compacto */
        width: 40px; /* Largura fixa para o número */
        height: 40px; /* Altura fixa para o número */
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }

    .mini-card:hover {
        background-color: var(--card-hover);
        transform: translateY(-2px);
    }

    .mini-card.active {
        background-color: var(--accent-color);
        color: var(--bg-dark); /* Texto escuro no card ativo */
        border-color: var(--accent-color);
    }

    .placeholder-text {
        color: #888;
        font-style: italic;
    }

    /* Responsividade básica */
    @media (max-width: 600px) {
        body {
            padding: 10px;
        }
        #stage-title {
            font-size: 2em;
        }
        #topic-title {
            font-size: 1.5em;
        }
        .mini-cards {
            justify-content: center;
        }
    }
    </style>
</head>
<body>

    <div class="title-area">
        <h1 id="stage-title">Selecione um Estágio</h1>
    </div>

    <div class="card-area">
        <div class="card-label">Estágios</div>
        <div class="mini-cards" id="stage-cards-container">
            </div>
    </div>

    <hr>

    <div class="title-area">
        <h2 id="topic-title">Selecione um Tópico</h2>
    </div>

    <div class="card-area">
        <div class="card-label">Tópicos Relacionados ao Estágio Selecionado</div>
        <div class="mini-cards" id="topic-cards-container">
            <span class="placeholder-text">Clique em um Estágio para ver os Tópicos.</span>
            </div>
    </div>

    <script>
        // --- Dados de Exemplo ---
        const stagesData = [
            { id: 1, title: 'Iniciação do Projeto' },
            { id: 2, title: 'Planejamento Detalhado' },
            { id: 3, title: 'Execução e Monitoramento' },
            { id: 4, title: 'Encerramento e Revisão' }
        ];

        const topicsData = {
            1: [ // Tópicos para Estágio 1
                { id: 1.1, title: 'Definição de Escopo' },
                { id: 1.2, title: 'Análise de Viabilidade' },
                { id: 1.3, title: 'Termo de Abertura' }
            ],
            2: [ // Tópicos para Estágio 2
                { id: 2.1, title: 'Cronograma' },
                { id: 2.2, title: 'Gestão de Riscos' },
                { id: 2.3, title: 'Orçamento' },
                { id: 2.4, title: 'Comunicação' }
            ],
            3: [ // Tópicos para Estágio 3
                { id: 3.1, title: 'Gerenciamento de Equipe' },
                { id: 3.2, title: 'Relatórios de Status' },
                { id: 3.3, title: 'Controle de Mudanças' }
            ],
            4: [ // Tópicos para Estágio 4
                { id: 4.1, title: 'Lições Aprendidas' },
                { id: 4.2, title: 'Entrega Final' },
                { id: 4.3, title: 'Fechamento de Contratos' }
            ]
        };

        // --- Elementos DOM ---
        const stageTitleEl = document.getElementById('stage-title');
        const topicTitleEl = document.getElementById('topic-title');
        const stageCardsContainer = document.getElementById('stage-cards-container');
        const topicCardsContainer = document.getElementById('topic-cards-container');

        let activeStageId = null;

        // --- Funções ---

        // Cria e injeta os mini cards de Estágio na DOM
        function renderStageCards() {
            stageCardsContainer.innerHTML = '';
            stagesData.forEach(stage => {
                const card = document.createElement('div');
                card.classList.add('mini-card', 'stage-card');
                card.dataset.id = stage.id;
                card.textContent = stage.id; // Apenas o número

                card.addEventListener('click', () => handleStageClick(stage.id, stage.title));

                stageCardsContainer.appendChild(card);
            });
        }

        // Cria e injeta os mini cards de Tópico na DOM
        function renderTopicCards(stageId) {
            topicCardsContainer.innerHTML = '';
            const currentTopics = topicsData[stageId];

            if (!currentTopics || currentTopics.length === 0) {
                topicCardsContainer.innerHTML = '<span class="placeholder-text">Nenhum tópico encontrado para este estágio.</span>';
                return;
            }

            currentTopics.forEach(topic => {
                const card = document.createElement('div');
                card.classList.add('mini-card', 'topic-card');
                card.dataset.id = topic.id;
                card.textContent = topic.id; // Apenas o número (ou número do tópico)

                card.addEventListener('click', () => handleTopicClick(topic.id, topic.title));

                topicCardsContainer.appendChild(card);
            });
        }

        // Lida com o clique em um mini card de Estágio
        function handleStageClick(stageId, stageTitle) {
            // Atualiza o título do Estágio
            stageTitleEl.textContent = `Estágio ${stageId}: ${stageTitle}`;
            activeStageId = stageId;

            // Remove a classe 'active' de todos os cards de Estágio
            document.querySelectorAll('.stage-card').forEach(card => {
                card.classList.remove('active');
            });

            // Adiciona a classe 'active' ao card clicado
            document.querySelector(`.stage-card[data-id="${stageId}"]`).classList.add('active');

            // Renderiza os cards de Tópico para o Estágio selecionado
            renderTopicCards(stageId);

            // Reseta o título do Tópico
            topicTitleEl.textContent = 'Selecione um Tópico';
        }

        // Lida com o clique em um mini card de Tópico
        function handleTopicClick(topicId, topicTitle) {
            // Atualiza o título do Tópico
            topicTitleEl.textContent = `Tópico ${topicId}: ${topicTitle}`;

            // Remove a classe 'active' de todos os cards de Tópico
            document.querySelectorAll('.topic-card').forEach(card => {
                card.classList.remove('active');
            });

            // Adiciona a classe 'active' ao card clicado
            document.querySelector(`.topic-card[data-id="${topicId}"]`).classList.add('active');
        }

        // Inicialização: Renderiza os cards de Estágio ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            renderStageCards();
        });
    </script>

</body>
</html>
