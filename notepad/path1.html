<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage & Topics Viewer</title>
<style>
    :root {
    --bg-dark: #121212;
    --text-light: #e0e0e0;
    --accent-color: #bb86fc; /* Cor de destaque para o tema dark */
    --card-bg: #1e1e1e;
    --card-hover: #2c2c2c;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-light);
        margin: 0;
        padding: 10px; /* Reduzido de 20px para 10px */
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    /* --- Títulos --- */
    .title-area {
        padding: 10px 0; /* Reduzido padding vertical */
        text-align: center;
        margin-bottom: 10px; /* Reduzido de 20px para 10px */
        width: 100%;
        max-width: 600px;
    }

    #stage-title {
        font-size: 2.2em; /* Levemente reduzido */
        color: var(--accent-color);
        margin: 0;
    }

    #topic-title {
        font-size: 1.6em; /* Levemente reduzido */
        color: var(--text-light);
        margin: 0;
    }

    /* --- Separador --- */
    hr {
        border: none;
        height: 1px;
        background-color: var(--card-bg);
        width: 90%; /* Aumentado para preencher mais */
        max-width: 600px;
        margin: 5px 0 20px 0; /* Espaço reduzido após a linha */
    }

    /* --- Área de Cards --- */
    .card-area {
        width: 100%;
        max-width: 600px;
        margin-bottom: 40px; /* Reduzido de 30px para 15px */
    }

    .card-label {
        font-size: 0.7em; /* Levemente reduzido */
        color: var(--accent-color);
        margin: 0 40px;
        letter-spacing: 1px; /* Reduzido o espaçamento entre letras */
        text-transform: uppercase;
        margin-bottom: 5px; /* Reduzido de 10px para 5px */
        text-align: left;
    }

    .mini-cards {
        display: flex;
        flex-wrap: wrap;
        margin: 0 40px;
        gap: 5px; /* Reduzido de 10px para 5px */
        padding: 10px; /* Reduzido de 15px para 10px */
        background-color: var(--card-bg);
        border-radius: 8px;
        min-height: 40px; 
        justify-content: center;
    }

    .mini-card {
        background-color: var(--bg-dark);
        color: var(--text-light);
        border: 1px solid var(--accent-color);
        border-radius: 4px;
        padding: 5px 20px; /* Reduzido para um card mais compacto */
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s, transform 0.1s;
        /* Estilo para ter apenas o número e ser compacto */
        width: 35px; /* Reduzido de 40px para 35px */
        height: 35px; /* Reduzido de 40px para 35px */
        font-size: 0.9em; /* Levemente reduzido o tamanho da fonte */
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }

    .mini-card:hover {
        background-color: var(--card-hover);
        transform: translateY(-2px);
    }

    .mini-card.active {
        background-color: var(--accent-color);
        color: var(--bg-dark);
        border-color: var(--accent-color);
    }

    .placeholder-text {
        color: #888;
        font-style: italic;
    }

    /* Responsividade básica */
    @media (max-width: 600px) {
        body {
            padding: 5px; /* Mais compacto em telas pequenas */
        }
        #stage-title {
            font-size: 1.8em;
        }
        #topic-title {
            font-size: 1.3em;
        }
        .mini-cards {
            justify-content: center;
        }
        .mini-card {
            width: 30px;
            height: 30px;
        }
    }
</style>
</head>
<body>

    <div class="title-area">
        <h1 id="stage-title">Selecione um Estágio</h1>
    </div>

    <div class="card-area">
        <div class="card-label">Estágios</div>
        <div class="mini-cards" id="stage-cards-container">
        </div>
    </div>

    <hr>

    <div class="title-area">
        <h2 id="topic-title">Selecione um Tópico</h2>
    </div>

    <div class="card-area">
        <div class="card-label">Tópicos Relacionados ao Estágio Selecionado</div>
        <div class="mini-cards" id="topic-cards-container">
            </div>
    </div>

    <script>
        // --- Dados ---
        const projectData = [
          {
              title: 'Iniciação do Projeto',
              topics: [
                  { title: 'Definição de Escopo', content: 'Detalhes sobre como definir o escopo inicial.' },
                  { title: 'Análise de Viabilidade', content: 'Métodos para avaliar a viabilidade do projeto.' },
                  { title: 'Termo de Abertura', content: 'Guia para a criação do Termo de Abertura (Project Charter).' }
              ]
          },
          {
              title: 'Planejamento Detalhado',
              topics: [
                  { title: 'Cronograma', content: 'Como estruturar o cronograma principal.' },
                  { title: 'Gestão de Riscos', content: 'Identificação e mitigação de riscos.' },
                  { title: 'Orçamento', content: 'Processo de detalhamento orçamentário.' },
                  { title: 'Comunicação', content: 'Plano de comunicação e stakeholders.' } // Este será o 2.4
              ]
          },
          {
              title: 'Execução e Monitoramento',
              topics: [
                  { title: 'Gerenciamento de Equipe', content: 'Técnicas de liderança e gestão de equipe.' },
                  { title: 'Relatórios de Status', content: 'Frequência e formato dos relatórios de status.' },
                  { title: 'Controle de Mudanças', content: 'Protocolo para gerenciar solicitações de mudança.' }
              ]
          }
          // Adicione mais estágios aqui, se necessário
      ];
     
 // --- Elementos DOM (Permanecem os mesmos) ---
const stageTitleEl = document.getElementById('stage-title');
const topicTitleEl = document.getElementById('topic-title');
const stageCardsContainer = document.getElementById('stage-cards-container');
const topicCardsContainer = document.getElementById('topic-cards-container');

let activeStageId = null;
let structuredData = []; // Aqui será armazenada a estrutura de dados com os IDs gerados

// --- Função de Geração Dinâmica de IDs ---
function generateDynamicIds(data) {
    const structured = [];
    
    // Itera sobre os Estágios (Stage Index + 1 = Stage ID)
    data.forEach((stage, stageIndex) => {
        const stageId = stageIndex + 1;
        
        const topicsWithIds = stage.topics.map((topic, topicIndex) => ({
            stageId: stageId,
            id: parseFloat(`${stageId}.${topicIndex + 1}`), // Gera ID como 1.1, 1.2, 2.1, etc.
            title: topic.title,
            content: topic.content 
        }));
        
        structured.push({
            id: stageId,
            title: stage.title,
            topics: topicsWithIds
        });
    });
    
    return structured;
}

// --- Funções de Renderização e Click (Ajustadas para usar structuredData) ---

function renderStageCards() {
    stageCardsContainer.innerHTML = '';
    structuredData.forEach(stage => {
        const card = document.createElement('div');
        card.classList.add('mini-card', 'stage-card');
        card.dataset.id = stage.id;
        card.textContent = stage.id;

        // O handleStageClick é chamado com os novos IDs
        card.addEventListener('click', () => handleStageClick(stage.id, stage.title));

        stageCardsContainer.appendChild(card);
    });
}

function renderTopicCards(stageId) {
    topicCardsContainer.innerHTML = '';
    
    // Encontra o estágio correto na estrutura de dados
    const currentStage = structuredData.find(s => s.id === stageId);

    if (!currentStage || currentStage.topics.length === 0) {
        return;
    }

    currentStage.topics.forEach(topic => {
        const card = document.createElement('div');
        card.classList.add('mini-card', 'topic-card');
        card.dataset.id = topic.id;
        card.textContent = topic.id; // Ex: 1.1, 2.4

        // O handleTopicClick é chamado com os novos IDs
        card.addEventListener('click', () => handleTopicClick(topic.id, topic.title, topic.content));

        topicCardsContainer.appendChild(card);
    });
}

function handleStageClick(stageId, stageTitle) {
    stageTitleEl.textContent = `Estágio ${stageId}: ${stageTitle}`;
    activeStageId = stageId;

    // Atualiza o destaque do Estágio
    document.querySelectorAll('.stage-card').forEach(card => {
        card.classList.remove('active');
    });
    document.querySelector(`.stage-card[data-id="${stageId}"]`).classList.add('active');

    // Renderiza os cards de Tópico
    renderTopicCards(stageId);

    // Seleção Automática do Primeiro Tópico do novo Estágio
    const currentStage = structuredData.find(s => s.id === stageId);
    
    if (currentStage && currentStage.topics.length > 0) {
        const firstTopic = currentStage.topics[0];
        // Note que o handleTopicClick agora espera o content
        handleTopicClick(firstTopic.id, firstTopic.title, firstTopic.content);
    } else {
        // Se não houver tópicos, limpa o título
        topicTitleEl.textContent = 'Nenhum Tópico Encontrado';
    }
}

// O handleTopicClick foi ajustado para aceitar e, futuramente, exibir o Content
function handleTopicClick(topicId, topicTitle, topicContent) {
    // Atualiza o título do Tópico
    topicTitleEl.textContent = `Tópico ${topicId}: ${topicTitle}`;
    
    // Futuramente: Exibir o Content. Exemplo:
    // console.log("Conteúdo do Tópico:", topicContent); 

    // Atualiza o destaque do Tópico
    document.querySelectorAll('.topic-card').forEach(card => {
        card.classList.remove('active');
    });
    const activeTopicCard = document.querySelector(`.topic-card[data-id="${topicId}"]`);
    if (activeTopicCard) {
        activeTopicCard.classList.add('active');
    }
}

// --- Inicialização (MODIFICADA) ---
document.addEventListener('DOMContentLoaded', () => {
    // 1. Gera a estrutura de dados completa com IDs
    structuredData = generateDynamicIds(projectData);

    // 2. Renderiza os Estágios
    renderStageCards();

    // 3. Seleção Automática Inicial (Estágio 1). O handleStageClick cuidará do Tópico 1.1.
    if (structuredData.length > 0) {
        const initialStage = structuredData[0];
        handleStageClick(initialStage.id, initialStage.title);
    }
});
    </script>

</body>
</html>
