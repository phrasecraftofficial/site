<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tópicos Fundamentais - Inglês</title>
</head>
<body style="background-color: #0a192f; color: #e6f1ff; font-family: sans-serif; margin: 0; padding: 20px; line-height: 1.6;">

    <div id="content-root" style="max-width: 900px; margin: 0 auto; background-color: #112240; padding: 40px; border-radius: 8px; border-left: 8px solid #722f37;">
        </div>

    <script>
        const data = {
            "stage_title": "Tópicos Fundamentais",
            "topics": [
                {
                    "topic_title": "Pronomes Pessoais e Verbo To Be",
                    "content": [
                        { "type": "subtitle", "value": "O Verbo To Be (Ser/Estar)" },
                        { "type": "text", "value": "O verbo 'to be' muda de forma dependendo do sujeito da frase. Ele é a base da comunicação em inglês." },
                        {
                            "type": "table",
                            "headers": ["Sujeito", "Forma (Be)", "Contração"],
                            "rows": [
                                ["I (Eu)", "am", "I'm"],
                                ["You/We/They (Você/Nós/Eles)", "are", "You're/We're/They're"],
                                ["He/She/It (Ele/Ela/Coisas)", "is", "He's/She's/It's"]
                            ]
                        },
                        { "type": "subtitle", "value": "Exemplos de Uso" },
                        { "type": "example", "value": { "en": "I am happy in the morning.", "pt": "Eu sou/estou feliz de manhã." } },
                        { "type": "example", "value": { "en": "Are you excited?", "pt": "Você está animado?" } },
                        { "type": "example", "value": { "en": "She is not shy.", "pt": "Ela não é tímida." } },
                        { "type": "tip", "title": "Dica de Interrogação", "text": "Para fazer perguntas com To Be, basta inverter a ordem: o verbo vem antes do sujeito (Ex: Is he...? / Are you...?)" }
                    ],
                    "tasks": [
                        {
                            "id": "f1_1",
                            "tipo": "quiz",
                            "pergunta": "Qual a forma correta do verbo To Be para 'They'?",
                            "opcoes": [
                                { "texto": "am", "correta": false },
                                { "texto": "is", "correta": false },
                                { "texto": "are", "correta": true }
                            ],
                            "explicacao": "Para plurais (You, We, They), usamos sempre 'are'."
                        }
                    ]
                },
                {
                    "topic_title": "Artigos e Determinantes (A, An, The)",
                    "content": [
                        { "type": "subtitle", "value": "1. Artigos Indefinidos (A / An)" },
                        { "type": "text", "value": "Usados para coisas não específicas no singular. Equivalem a 'um' ou 'uma'." },
                        { "type": "list", "value": [
                            "A: Usado antes de som de CONSOANTE (Ex: A laptop).",
                            "An: Usado antes de som de VOGAL (Ex: An orange)."
                        ]},
                        { "type": "subtitle", "value": "2. Artigo Definido (The)" },
                        { "type": "text", "value": "Usado quando falamos de algo específico que o ouvinte já conhece. Equivale a 'o, a, os, as'." },
                        { "type": "example", "value": { "en": "Could you pass me the salt?", "pt": "Você poderia me passar o sal? (Aquele sal na mesa)." } },
                        { "type": "subtitle", "value": "3. Zero Article (Sem Artigo)" },
                        { "type": "text", "value": "Em inglês, não usamos artigos para conceitos gerais, cidades ou plurais genéricos." },
                        { "type": "example", "value": { "en": "Creativity is essential.", "pt": "Criatividade é essencial. (Conceito abstrato)." } },
                        { "type": "tip", "title": "Cuidado com o Som!", "text": "O que importa é o SOM e não a letra. 'An hour' (H mudo) e 'A uniform' (U com som de Y)." }
                    ],
                    "tasks": [
                        {
                            "id": "f2_1",
                            "tipo": "fill_the_blank",
                            "pergunta": "I have ___ umbrella in my car.",
                            "opcoes": ["a", "an", "the"],
                            "resposta_correta": "an"
                        }
                    ]
                },
                {
                    "topic_title": "Quantificadores (Much, Many, Some, Any)",
                    "content": [
                        { "type": "subtitle", "value": "Coisas Contáveis vs. Incontáveis" },
                        { "type": "text", "value": "Em inglês, dividimos as quantidades entre o que podemos contar (maçãs, amigos) e o que não podemos (água, tempo, dinheiro)." },
                        {
                            "type": "table",
                            "headers": ["Uso", "Contáveis", "Incontáveis"],
                            "rows": [
                                ["Grande quantidade", "MANY", "MUCH"],
                                ["Pequena quantidade", "A FEW", "A LITTLE"],
                                ["Quase nada", "FEW", "LITTLE"]
                            ]
                        },
                        { "type": "subtitle", "value": "Uso de 'Some' e 'Any'" },
                        { "type": "list", "value": [
                            "SOME: Usado em frases afirmativas (I have some water).",
                            "ANY: Usado em negativas e perguntas (I don't have any water / Do you have any water?)."
                        ]},
                        { "type": "example", "value": { "en": "We have plenty of time.", "pt": "Nós temos tempo de sobra (Plenty of)." } }
                    ],
                    "tasks": [
                        {
                            "id": "f3_1",
                            "tipo": "connect_pairs",
                            "titulo": "Conecte os Quantificadores",
                            "pares": [
                                { "chave": "Many", "valor": "Muitos (Contável)" },
                                { "chave": "Much", "valor": "Muito (Incontável)" },
                                { "chave": "A little", "valor": "Um pouco (Incontável)" },
                                { "chave": "A few", "valor": "Alguns (Contável)" }
                            ]
                        }
                    ]
                }
            ]
        };

        function renderPage() {
            const root = document.getElementById('content-root');
            let html = `<h1 style="color: #64ffda; border-bottom: 2px solid #722f37; padding-bottom: 10px;">${data.stage_title}</h1>`;

            data.topics.forEach((topic, index) => {
                html += `<section style="margin-bottom: 40px;">
                    <h2 style="color: #f1d3d6; background-color: #1d3354; padding: 10px; border-radius: 4px;">${index + 1}. ${topic.topic_title}</h2>`;

                topic.content.forEach(item => {
                    if (item.type === "subtitle") {
                        html += `<h3 style="color: #ccd6f6; margin-top: 25px;">${item.value}</h3>`;
                    } else if (item.type === "text") {
                        html += `<p>${item.value}</p>`;
                    } else if (item.type === "list") {
                        html += `<ul>${item.value.map(li => `<li>${li}</li>`).join('')}</ul>`;
                    } else if (item.type === "table") {
                        html += `<table style="width: 100%; border-collapse: collapse; margin: 20px 0; background-color: #0a192f;">
                            <thead><tr style="border-bottom: 2px solid #722f37; text-align: left;">
                                ${item.headers.map(h => `<th style="padding: 12px;">${h}</th>`).join('')}
                            </tr></thead>
                            <tbody>
                                ${item.rows.map(row => `<tr style="border-bottom: 1px solid #1d3354;">
                                    ${row.map(cell => `<td style="padding: 10px;">${cell}</td>`).join('')}
                                </tr>`).join('')}
                            </tbody>
                        </table>`;
                    } else if (item.type === "example") {
                        html += `<p style="font-style: italic; background-color: #0a192f; padding: 10px; border-left: 4px solid #64ffda; margin-bottom: 10px;">
                            <strong>EN:</strong> ${item.value.en} | <strong>PT:</strong> ${item.value.pt}
                        </p>`;
                    } else if (item.type === "tip") {
                        html += `<div style="background-color: #722f3733; border: 1px solid #722f37; padding: 15px; border-radius: 4px; margin-top: 15px;">
                            <strong style="color: #f1d3d6;">💡 ${item.title}:</strong> ${item.text}
                        </div>`;
                    }
                });

                // Renderização de Tasks (Quiz, Fill, Connect)
                topic.tasks.forEach(task => {
                    html += `<div style="margin-top: 20px; padding: 15px; border: 1px dashed #64ffda; border-radius: 4px;">`;
                    if (task.tipo === "quiz") {
                        html += `<p><strong>Questão:</strong> ${task.pergunta}</p>`;
                        task.opcoes.forEach(opt => {
                            html += `<label style="display: block; margin-bottom: 5px;">
                                <input type="radio" name="${task.id}"> ${opt.texto} ${opt.correta ? '<span style="color: #64ffda; font-size: 0.8em; margin-left: 10px;">(Correta)</span>' : ''}
                            </label>`;
                        });
                        html += `<p style="font-size: 0.9em; color: #8892b0; margin-top: 10px;"><em>Explicação: ${task.explicacao}</em></p>`;
                    } else if (task.tipo === "fill_the_blank") {
                        html += `<p><strong>Preencha a lacuna:</strong> ${task.pergunta}</p>`;
                        html += `<p style="color: #64ffda;">Resposta correta: ${task.resposta_correta}</p>`;
                    } else if (task.tipo === "connect_pairs") {
                        html += `<p><strong>${task.titulo}:</strong></p><ul style="list-style: none; padding: 0;">`;
                        task.pares.forEach(p => {
                            html += `<li>🔗 ${p.chave} &rarr; ${p.valor}</li>`;
                        });
                        html += `</ul>`;
                    }
                    html += `</div>`;
                });

                html += `</section>`;
            });

            root.innerHTML = html;
        }

        window.onload = renderPage;
    </script>
</body>
</html>
