<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Extrair Letra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-bottom: 10px;
      font-family: monospace;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      white-space: pre-line;
      background: #fff;
      padding: 15px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h2>Extrair letra do código HTML</h2>

  <textarea id="input" placeholder="Cole aqui o código HTML da letra..."></textarea>

  <button onclick="extrairLetra()">Extrair letra</button>

  <div id="output"></div>

  <script>
    function extrairLetra() {
      const html = document.getElementById("input").value;

      // Cria um DOM temporário
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // Seleciona apenas os <p> que contêm letras
      const linhas = doc.querySelectorAll("p[data-encore-id='text']");

      let resultado = [];

      linhas.forEach(p => {
        const texto = p.textContent.trim();
        if (texto) {
          resultado.push(texto);
        }
      });

      document.getElementById("output").textContent = resultado.join("\n");
    }
  </script>

</body>
</html>
