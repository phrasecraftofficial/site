<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página com Main e Section</title>
  <style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background-color: #000;
  color: #fff;
}
main {
}
section {
}
.width-area, p {
  display: flex;
  justify-content: center; /* centraliza na horizontal */
  margin: 10px;
  align-items: flex-start;
  gap: 10px; /* espaço entre as seções */
}
.height-area {
  display: flex;
  align-items: center; /* centraliza na vertial */
  gap: 4px;
  padding: 10px;
  color: #;
  background: ;
  border-radius: 10px;
  font-weight: bold;
  margin-bottom: 10px;
}
.column-area {
  display: flex;
  margin: 0 auto; /* centraliza o form no contêiner pai */
  flex-direction: column;
  gap: 4px;
}
.line-area {
  display: flex;
  margin: 0 auto; /* centraliza o form no contêiner pai */
  flex-direction: ;
  gap: 4px;
}
input, textarea {
    border: 1px solid #555; 
    border-radius: 4px; 
    padding: 10px 12px; 
    font-size: 14px; 
    width: 90px; 
    max-width: 300px; 
    background-color: #121212; 
    color: #e0e0e0; 
    transition: border-color 0.2s ease; 
} 
input:focus, textarea:focus { 
    border-color: #3ea6ff; 
    outline: none; 
}
#editEnd, #editStart, #editStack {
    width: 70px;
} 
textarea {
    width: 250px; 
    max-width: 600px; 
} 
button {
  width: 30px;
  height: 30px;
  font-size: 18px;
  cursor: pointer;
  border: none; 
  background-color: #263238; 
  color: #3ea6ff;
  border-radius: 4px;
  transition: background 0.2s;
}
button:hover {
	background-color: #bbb;
  color: #000;
}
.general-btn { 
    background-color: transparent; 
    border: none; 
    color: #3ea6ff; 
    font-weight: 500; 
    cursor: pointer; 
    padding: 8px 12px; 
    border-radius: 4px; 
    transition: background-color 0.2s ease; 
	width: auto;
	height: auto;
      }
.general-btn:hover { 
	background-color: #263238; 
}
    }
/*thumb-section*/
.video-section, .thumb-section { 
  width: 100%;
  height: auto;
}

video, .thumb-section img {
  max-height: 400px;
  max-width: 600px;
  width: 100%;
  display: block;
  margin: 0 auto;
}
  </style>
</head>
<body>

<main>
  <!-- Seções -->
  <section id="home">
  </section>
    
  <!----------->
  <!--editSrt-->
  <!----------->
  <section id="editSrt">
    <div class="column-area" id="save-area">
        <span id="btn-close" onclick="closeLoadSaveArea()">&times;</span>
        <p>💾 Salvar</p>
        <div class="line-area">
            <button class="general-btn" onclick="copyToClipboard()">📋 Copiar</button>
            <button class="general-btn" onclick="downSrt()">⬇️ Download</button>
            <button class="general-btn" onclick="showSRT()">🧾 Exibir</button>
        </div>
    </div><!--save-area-->
      
	<div id="subtitleName">
    	<!-- Div para exibir o nome do arquivo da legenda -->
	</div>
    
	<div class="column-area" id="video-section-editor">
		<video id="videoPlayer" controls>
			<source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
		</video>
	</div>

	<div id="editor">
	<form class="width-area" class="width-area">
    	<button type="button" id="btn-save" onclick="showSave()">💾</button>
    	<button type="button" onclick="undo()">↩</button>
    	<button type="button" onclick="redo()">↪</button>
    	<button type="button" id="btn-config" onclick="showConfig()">⚙</button>
    	<button type="button" onclick="addSegment()">|+</button>
    	<button type="button" onclick="removeSegment()">|-</button>
    	<button type="button" id="btn-load" onclick="showSection('postLesson')">👉</button>
	</form>
	<form class="width-area">
      <label class="height-area">
        <div class="column-area">
          Início
          <input type="text" id="editStart" value="00:00:000">
        </div>
        <div class="column-area">
          <button type="button" onclick="adjustTime('start', -TIME_STEP)">−</button>
          <button type="button" onclick="adjustTime('start', +TIME_STEP)">+</button>
        </div>
      </label>
      <label class="height-area">
        <div class="column-area">
          Fim
          <input id="editEnd" value="00:00:000">
        </div>
        <div class="column-area">
          <button type="button" onclick="adjustTime('end', -TIME_STEP)">−</button>
          <button type="button" onclick="adjustTime('end', +TIME_STEP)">+</button>
        </div>
      </label>
    </form>
    <form class="width-area" class="width-area">
      <label class="height-area">Texto
          <textarea type="text" id="editText" rows="3"></textarea>
      </label>
    </form>
    </div><!--editor-->
    <form class="width-area" id="navigation-controls-previewMode">
		<button type="button" onclick="prevLine()">⏮︎</button>
		<button type="button" onclick="playLine()">⏯︎</button>
		<button type="button" onclick="nextLine()">⏭︎</button>
	</form>
	<div class="column-area" id="config-area">
		<span id="btn-close" onclick="closeLoadSaveArea()">&times;</span>
     	<p>⚙ Editar em lote</p>
         <form class="width-area"  class="line-area">
           <button type="button" class="general-btn" onclick="showEarlier()">Adiantar</button>
           <input id="editStack" placeholder="0.05">
           <button type="button" class="general-btn" onclick="showLater()">Atrasar</button>
		</form>
		<form class="width-area" class="column-area" id="linhaForm">
			<span class="radio-option">
				<input type="radio" name="opcao-linha" value="all" checked>
				Todas as linhas
			</span>
			<span class="radio-option">
				<input type="radio" name="opcao-linha" value="current">
				Apenas linha atual
			</span>
			<span class="radio-option">
				<input type="radio" name="opcao-linha" value="from-current">
				Linha selecionada e próximas linhas
			</span>
		</form>
	</div><!--config-area-->
    <div class="segmentsArea" id="segments-area">
    	  <span>Lista de Legendas</span>
        <div id="segments"></div>
    </div>
	</section>

  <script>
  </script>
</body>
</html>
